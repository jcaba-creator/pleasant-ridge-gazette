  </div>

  <!-- ================= 4. SLIDE-UP BOTTOM SHEET (INTEL & RADAR) ================= -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Regional War Intel & Difficulty</div>
      <button class="sheet-close-btn" id="btnCloseSheet">✕ Close</button>
    </div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>

  <script>
    /* ==========================================================================
       AGES OF CONSTANT CONFLICT: REGIONAL CONFLICT (300x300 HIGH-PERFORMANCE ENGINE)
       Seasons Cycle • Neutral Outlaw Gangs • Decisive Breakthroughs • Warp Speeds
       ========================================================================== */

    const W = 300;
    const H = 300;
    const TOTAL_CELLS = W * H;

    const TERRAIN = {
      FIELD: 0,
      FOREST: 1,
      RIVER: 2,
      ROAD: 3,
      BRIDGE: 4,
      ICE: 5
    };

    // PRNG
    class PRNG {
      constructor(seedStr) {
        let h = 1779033703 ^ seedStr.length;
        for (let i = 0; i < seedStr.length; i++) {
          h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        this.s = h >>> 0;
      }
      next() {
        let t = (this.s += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      range(min, max) { return min + this.next() * (max - min); }
      rangeInt(min, max) { return Math.floor(this.range(min, max + 1)); }
    }

    // Major County Seats
    const REGIONAL_COUNTIES = [
      { id: 1, name: "Leavenworth Citadel", hex: "#2563eb", rgb: [37, 99, 235], baseAtk: 1.30, baseDef: 1.45, town: "Leavenworth", isGang: false },
      { id: 2, name: "Atchison River Barons", hex: "#dc2626", rgb: [220, 38, 38], baseAtk: 1.40, baseDef: 1.15, town: "Atchison", isGang: false },
      { id: 3, name: "Oskaloosa Coalition", hex: "#16a34a", rgb: [22, 163, 74], baseAtk: 1.20, baseDef: 1.35, town: "Oskaloosa", isGang: false },
      { id: 4, name: "Lansing Ironclad", hex: "#d97706", rgb: [217, 119, 6], baseAtk: 1.25, baseDef: 1.40, town: "Lansing", isGang: false },
      { id: 5, name: "Easton Rangers", hex: "#9333ea", rgb: [147, 51, 234], baseAtk: 1.45, baseDef: 1.10, town: "Easton", isGang: false },
      { id: 6, name: "Tonganoxie Guard", hex: "#0891b2", rgb: [8, 145, 178], baseAtk: 1.15, baseDef: 1.35, town: "Tonganoxie", isGang: false }
    ];

    // Neutral Outlaw Gangs holding crossroads and wilderness at start
    const OUTLAW_GANGS = [
      { id: 101, name: "Stranger Valley Rustlers", hex: "#e11d48", rgb: [225, 29, 72], baseAtk: 0.90, baseDef: 0.80, town: "Rustler Camp", isGang: true, x: 140, y: 175 },
      { id: 102, name: "Timber Ridge Marauders", hex: "#7c2d12", rgb: [124, 45, 18], baseAtk: 0.95, baseDef: 0.85, town: "Marauder Den", isGang: true, x: 95, y: 70 },
      { id: 103, name: "Salt Creek Bushwhackers", hex: "#475569", rgb: [71, 85, 105], baseAtk: 0.85, baseDef: 0.75, town: "Bushwhack Hold", isGang: true, x: 180, y: 105 },
      { id: 104, name: "Delaware River Pirates", hex: "#0f766e", rgb: [15, 118, 110], baseAtk: 0.90, baseDef: 0.80, town: "Pirate Haven", isGang: true, x: 175, y: 245 }
    ];

    const state = {
      elevation: new Uint8Array(TOTAL_CELLS),
      terrain: new Uint8Array(TOTAL_CELLS),
      baseTerrain: new Uint8Array(TOTAL_CELLS), // To restore post-winter ice melt
      owner: new Uint8Array(TOTAL_CELLS),
      frontline: new Uint8Array(TOTAL_CELLS),
      supply: new Uint8Array(TOTAL_CELLS),

      factions: new Map(),
      selectedFactionId: null,
      playerFactionId: null, // null = God Mode, 1..6 = Player Sovereign
      playerTreasury: 150,
      difficulty: 'veteran', // 'recruit', 'veteran', 'ironclad'

      season: 'spring', // 'spring', 'summer', 'autumn', 'winter'
      currentYear: 1,

      sparks: [],

      ticks: 0,
      speed: 1,
      isPaused: false,

      // Camera State (1:1 unified screen space)
      camX: 0,
      camY: 0,
      zoom: 1.0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,

      // Touch State (Pinch-to-zoom)
      touchStartDist: 0,
      initialTouchZoom: 1.0,

      activeTool: null, // 'strike', 'bridge', 'trench', 'target'
      seed: "EASTON-WATERSHED-2026"
    };

    // Canvases
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d', { alpha: false });

    // Layer 1: Static Baked Background Canvas (Hillshade + Biomes + Roads)
    const staticCanvas = document.createElement('canvas');
    staticCanvas.width = W;
    staticCanvas.height = H;
    const staticCtx = staticCanvas.getContext('2d', { alpha: false });

    // Layer 2: Dynamic Territorial Paint Buffer
    const dynamicCanvas = document.createElement('canvas');
    dynamicCanvas.width = W;
    dynamicCanvas.height = H;
    const dynamicCtx = dynamicCanvas.getContext('2d', { willReadFrequently: true });
    const territoryImageData = dynamicCtx.createImageData(W, H);

    // Layer 3: Minimap Offscreen
    const minimapCanvas = document.createElement('canvas');
    minimapCanvas.width = W;
    minimapCanvas.height = H;
    const minimapCtx = minimapCanvas.getContext('2d');

    let rng = new PRNG(state.seed);

    // --- 4. TOPOGRAPHIC & WATERSHED GENERATOR ---
    function initTheater(seed = null) {
      state.seed = seed || ("THEATER-" + Math.floor(Math.random() * 999999));
      rng = new PRNG(state.seed);

      state.ticks = 0;
      state.sparks = [];
      state.factions.clear();
      state.selectedFactionId = null;
      state.playerFactionId = null;
      state.playerTreasury = 150;
      state.season = 'spring';
      state.currentYear = 1;
      setArmedTool(null);
      updatePlayerHUD();

      state.elevation.fill(0);
      state.terrain.fill(TERRAIN.FIELD);
      state.baseTerrain.fill(TERRAIN.FIELD);
      state.owner.fill(0);
      state.frontline.fill(0);
      state.supply.fill(0);

      // Generate Elevation & Ridges
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const nx = x / 40.0;
          const ny = y / 40.0;
          const hill1 = Math.sin(nx * 1.5) * Math.cos(ny * 1.2);
          const hill2 = Math.sin(nx * 3.4 + 1.2) * Math.cos(ny * 2.8 + 0.4) * 0.5;
          const hill3 = Math.sin(nx * 7.1) * Math.cos(ny * 6.3) * 0.25;
          let elev = Math.floor(128 + (hill1 + hill2 + hill3) * 75);
          elev = Math.max(10, Math.min(245, elev));
          state.elevation[idx] = elev;

          if (elev > 165 && rng.next() > 0.45) {
            state.terrain[idx] = TERRAIN.FOREST;
            state.baseTerrain[idx] = TERRAIN.FOREST;
          }
        }
      }

      carveRivers();
      spawnCountySeats();
      spawnOutlawGangs();
      buildHighwayNetwork();
      bakeStaticHillshade();
      renderDynamicTerritoryBuffer();
      updateAllMinimaps();
      updateRoster();
      closeSelectionCard();

      showFlashNotice("WATERSHED INITIALIZED: CLEAR OUTLAWS TO PACIFY REGION!");
    }

    function carveRivers() {
      // Missouri River along eastern boundary
      for (let y = 0; y < H; y++) {
        const meander = Math.floor(Math.sin(y / 25.0) * 12 + Math.cos(y / 14.0) * 6);
        const rx = Math.max(0, Math.min(W - 1, (W - 25) + meander));
        for (let ox = -3; ox <= 3; ox++) {
          const cx = rx + ox;
          if (cx >= 0 && cx < W) {
            const idx = y * W + cx;
            state.terrain[idx] = TERRAIN.RIVER;
            state.baseTerrain[idx] = TERRAIN.RIVER;
            state.elevation[idx] = Math.max(8, state.elevation[idx] - 35);
          }
        }
      }

      // Stranger Creek cutting north to south through center-west
      for (let y = 0; y < H; y++) {
        const meander = Math.floor(Math.sin(y / 18.0) * 16 + Math.cos(y / 9.0) * 7);
        const rx = Math.max(0, Math.min(W - 1, 115 + meander));
        for (let ox = -2; ox <= 2; ox++) {
          const cx = rx + ox;
          if (cx >= 0 && cx < W) {
            const idx = y * W + cx;
            state.terrain[idx] = TERRAIN.RIVER;
            state.baseTerrain[idx] = TERRAIN.RIVER;
            state.elevation[idx] = Math.max(8, state.elevation[idx] - 25);
          }
        }
      }
    }

    function spawnCountySeats() {
      const positions = [
        { x: 235, y: 155 }, // Leavenworth Citadel
        { x: 220, y: 48 },  // Atchison River Barons
        { x: 50,  y: 145 }, // Oskaloosa Coalition
        { x: 230, y: 220 }, // Lansing Ironclad
        { x: 125, y: 110 }, // Easton Rangers
        { x: 110, y: 255 }  // Tonganoxie Guard
      ];

      REGIONAL_COUNTIES.forEach((meta, i) => {
        const pos = positions[i];

        const f = {
          ...meta,
          capitalX: pos.x,
          capitalY: pos.y,
          troops: 250,
          territory: 0,
          alive: true,
          supplyIndex: 100,
          offensiveBonus: 1.0,
          spearheadTarget: null
        };
        state.factions.set(meta.id, f);

        const r = 14;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const dist = Math.hypot(dx, dy);
            if (dist <= r) {
              const x = pos.x + dx;
              const y = pos.y + dy;
              if (x >= 0 && x < W && y >= 0 && y < H) {
                const idx = y * W + x;
                if (state.terrain[idx] !== TERRAIN.RIVER) {
                  state.owner[idx] = f.id;
                  f.territory++;
                }
              }
            }
          }
        }
      });
    }

    function spawnOutlawGangs() {
      OUTLAW_GANGS.forEach(gang => {
        const f = {
          ...gang,
          capitalX: gang.x,
          capitalY: gang.y,
          troops: 65, // Low initial troop count for satisfying early-game wins!
          territory: 0,
          alive: true,
          supplyIndex: 70,
          offensiveBonus: 0.9,
          spearheadTarget: null
        };
        state.factions.set(gang.id, f);

        const r = 9;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (Math.hypot(dx, dy) <= r) {
              const x = gang.x + dx;
              const y = gang.y + dy;
              if (x >= 0 && x < W && y >= 0 && y < H) {
                const idx = y * W + x;
                if (state.terrain[idx] !== TERRAIN.RIVER && state.owner[idx] === 0) {
                  state.owner[idx] = f.id;
                  f.territory++;
                }
              }
            }
          }
        }
      });
    }

    function buildHighwayNetwork() {
      const seats = Array.from(state.factions.values()).filter(f => !f.isGang);
      const connections = [
        [0, 1], // Leavenworth <-> Atchison (US-73 Corridor)
        [0, 3], // Leavenworth <-> Lansing (K-7 South)
        [0, 4], // Leavenworth <-> Easton (K-92 West)
        [4, 2], // Easton <-> Oskaloosa (K-92 West Crossing)
        [4, 5], // Easton <-> Tonganoxie (Stranger Valley Corridor)
        [3, 5]  // Lansing <-> Tonganoxie (US-24/40 Connector)
      ];

      connections.forEach(([i1, i2]) => {
        const s1 = seats[i1];
        const s2 = seats[i2];
        if (s1 && s2) {
          layPavedHighway(s1.capitalX, s1.capitalY, s2.capitalX, s2.capitalY);
        }
      });
    }

    function layPavedHighway(x0, y0, x1, y1) {
      let dx = Math.abs(x1 - x0);
      let dy = Math.abs(y1 - y0);
      let sx = x0 < x1 ? 1 : -1;
      let sy = y0 < y1 ? 1 : -1;
      let err = dx - dy;

      let cx = x0;
      let cy = y0;

      while (true) {
        if (cx >= 0 && cx < W && cy >= 0 && cy < H) {
          const idx = cy * W + cx;
          if (state.terrain[idx] === TERRAIN.RIVER) {
            state.terrain[idx] = TERRAIN.BRIDGE;
            state.baseTerrain[idx] = TERRAIN.BRIDGE;
          } else {
            state.terrain[idx] = TERRAIN.ROAD;
            state.baseTerrain[idx] = TERRAIN.ROAD;
          }
        }

        if (cx === x1 && cy === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; cx += sx; }
        if (e2 < dx) { err += dx; cy += sy; }
      }
    }

    function updateSeasonCycle(month) {
      let newSeason = 'spring';
      if (month === 12 || month <= 2) newSeason = 'winter';
      else if (month >= 3 && month <= 5) newSeason = 'spring';
      else if (month >= 6 && month <= 8) newSeason = 'summer';
      else newSeason = 'autumn';

      if (newSeason !== state.season) {
        state.season = newSeason;
        handleSeasonTransition(newSeason);
      }
    }

    function handleSeasonTransition(season) {
      if (season === 'winter') {
        // Freeze rivers into ice!
        for (let i = 0; i < TOTAL_CELLS; i++) {
          if (state.baseTerrain[i] === TERRAIN.RIVER) {
            state.terrain[i] = TERRAIN.ICE;
          }
        }
        showFlashNotice("❄️ WINTER HAS ARRIVED: WATERWAYS FROZEN OVER! INVASION ROUTES OPENED!");
      } else {
        // Thaw ice back to river
        for (let i = 0; i < TOTAL_CELLS; i++) {
          if (state.baseTerrain[i] === TERRAIN.RIVER) {
            state.terrain[i] = TERRAIN.RIVER;
          }
        }
        if (season === 'spring') {
          showFlashNotice("🌱 SPRING THAW: FLOODS RETURN TO WATERWAYS");
        } else if (season === 'summer') {
          showFlashNotice("☀️ SUMMER HARVEST: COMBAT SPEEDS PEAK (+25% TROOP INCOME)");
        } else {
          showFlashNotice("🍂 AUTUMN: STOCKPILE SUPPLIES BEFORE WINTER");
        }
      }
      bakeStaticHillshade();
    }

    function bakeStaticHillshade() {
      const img = staticCtx.createImageData(W, H);
      const data = img.data;

      const lx = -1.0;
      const ly = -1.0;
      const lz = 1.4;
      const lLen = Math.hypot(lx, ly, lz);
      const nlx = lx / lLen;
      const nly = ly / lLen;
      const nlz = lz / lLen;

      const isWinter = state.season === 'winter';

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const pIdx = idx * 4;

          const eLeft  = x > 0 ? state.elevation[y * W + (x - 1)] : state.elevation[idx];
          const eRight = x < W - 1 ? state.elevation[y * W + (x + 1)] : state.elevation[idx];
          const eUp    = y > 0 ? state.elevation[(y - 1) * W + x] : state.elevation[idx];
          const eDown  = y < H - 1 ? state.elevation[(y + 1) * W + x] : state.elevation[idx];

          const dzdx = (eRight - eLeft) / 2.0;
          const dzdy = (eDown - eUp) / 2.0;

          const nx = -dzdx;
          const ny = -dzdy;
          const nz = 1.0;
          const nLen = Math.hypot(nx, ny, nz);
          const dot = (nx / nLen) * nlx + (ny / nLen) * nly + (nz / nLen) * nlz;
          const shade = Math.max(0.2, Math.min(1.0, 0.5 + dot * 0.5));

          const t = state.terrain[idx];

          if (t === TERRAIN.ICE) {
            // Frozen cyan-white ice
            data[pIdx]     = Math.floor(165 * shade);
            data[pIdx + 1] = Math.floor(220 * shade);
            data[pIdx + 2] = Math.floor(245 * shade);
            data[pIdx + 3] = 255;
          } else if (t === TERRAIN.RIVER) {
            data[pIdx]     = 14;
            data[pIdx + 1] = 75;
            data[pIdx + 2] = 125;
            data[pIdx + 3] = 255;
          } else if (t === TERRAIN.BRIDGE) {
            data[pIdx]     = 220;
            data[pIdx + 1] = 175;
            data[pIdx + 2] = 85;
            data[pIdx + 3] = 255;
          } else if (t === TERRAIN.ROAD) {
            data[pIdx]     = 180;
            data[pIdx + 1] = 190;
            data[pIdx + 2] = 205;
            data[pIdx + 3] = 255;
          } else if (t === TERRAIN.FOREST) {
            if (isWinter) {
              data[pIdx]     = Math.floor(70 * shade);
              data[pIdx + 1] = Math.floor(90 * shade);
              data[pIdx + 2] = Math.floor(85 * shade);
            } else {
              data[pIdx]     = Math.floor(18 * shade);
              data[pIdx + 1] = Math.floor(58 * shade);
              data[pIdx + 2] = Math.floor(28 * shade);
            }
            data[pIdx + 3] = 255;
          } else {
            // Field
            if (isWinter) {
              // Snow covered fields
              data[pIdx]     = Math.floor(140 * shade);
              data[pIdx + 1] = Math.floor(155 * shade);
              data[pIdx + 2] = Math.floor(165 * shade);
            } else {
              data[pIdx]     = Math.floor(40 * shade);
              data[pIdx + 1] = Math.floor(52 * shade);
              data[pIdx + 2] = Math.floor(38 * shade);
            }
            data[pIdx + 3] = 255;
          }
        }
      }

      staticCtx.putImageData(img, 0, 0);
    }

    function renderDynamicTerritoryBuffer() {
      const data = territoryImageData.data;
      const fMap = state.factions;

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const owner = state.owner[i];
        const pIdx = i * 4;

        if (owner === 0) {
          data[pIdx]     = 0;
          data[pIdx + 1] = 0;
          data[pIdx + 2] = 0;
          data[pIdx + 3] = 0;
        } else {
          const f = fMap.get(owner);
          if (f && f.alive) {
            const isFront = state.frontline[i] === 1;
            const sup = state.supply[i];

            if (sup < 15) {
              data[pIdx]     = Math.floor(f.rgb[0] * 0.4);
              data[pIdx + 1] = Math.floor(f.rgb[1] * 0.4);
              data[pIdx + 2] = Math.floor(f.rgb[2] * 0.4);
              data[pIdx + 3] = 180;
            } else if (isFront) {
              data[pIdx]     = Math.min(255, f.rgb[0] + 65);
              data[pIdx + 1] = Math.min(255, f.rgb[1] + 65);
              data[pIdx + 2] = Math.min(255, f.rgb[2] + 65);
              data[pIdx + 3] = 245;
            } else {
              data[pIdx]     = f.rgb[0];
              data[pIdx + 1] = f.rgb[1];
              data[pIdx + 2] = f.rgb[2];
              data[pIdx + 3] = 210;
            }
          } else {
            data[pIdx]     = 60;
            data[pIdx + 1] = 60;
            data[pIdx + 2] = 60;
            data[pIdx + 3] = 120;
          }
        }
      }

      dynamicCtx.putImageData(territoryImageData, 0, 0);
    }

    // --- 7. FAST DECISIVE COMBAT & SEASONS SIMULATION ---
    function stepSimulation() {
      state.ticks++;

      const year = Math.floor(state.ticks / 120) + 1;
      const month = (Math.floor(state.ticks / 10) % 12) + 1;
      state.currentYear = year;

      updateSeasonCycle(month);

      const seasonIcons = { spring: '🌱 Spring', summer: '☀️ Summer', autumn: '🍂 Autumn', winter: '❄️ Winter' };
      document.getElementById('seasonIcon').innerText = seasonIcons[state.season].split(' ')[0];
      document.getElementById('simDateText').innerText = `Y${year} • ${seasonIcons[state.season].split(' ')[1]}`;

      // Treasury & reinforcements
      if (state.ticks % 15 === 0) {
        state.factions.forEach(f => {
          if (!f.alive) return;
          const supMult = f.supplyIndex / 100.0;
          let recruitGain = Math.floor((f.territory / 140) * supMult) + 2;

          // Summer boosts recruitment
          if (state.season === 'summer') recruitGain = Math.floor(recruitGain * 1.3);

          // Difficulty Adjustments
          if (state.playerFactionId === f.id) {
            if (state.difficulty === 'recruit') recruitGain = Math.floor(recruitGain * 1.5);
            state.playerTreasury = Math.min(999, state.playerTreasury + Math.floor(recruitGain * 1.5) + 3);
            updatePlayerHUD();
          } else if (state.difficulty === 'ironclad') {
            recruitGain = Math.floor(recruitGain * 1.35);
          }

          f.troops = Math.min(3000, f.troops + recruitGain);

          if (f.offensiveBonus > 1.0) {
            f.offensiveBonus = Math.max(1.0, f.offensiveBonus - 0.02);
          }
        });
      }

      // Decisive Frontline Breakthrough Sweeps
      resolveFrontlineBreakthroughs();

      // Periodic Supply Lines & Pocket Starvation Check
      if (state.ticks % 6 === 0) {
        updateFrontlinesAndPocketing();
        renderDynamicTerritoryBuffer();
        updateRoster();
        updateSelectedCardStats();
      }

      if (state.ticks % 25 === 0) {
        updateAllMinimaps();
      }
    }

    function resolveFrontlineBreakthroughs() {
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      // Fast pacing: more sweeps per tick ensures games resolve decisively!
      const sweeps = 350 + Math.floor(state.speed * 60);

      for (let s = 0; s < sweeps; s++) {
        const x = rng.rangeInt(1, W - 2);
        const y = rng.rangeInt(1, H - 2);
        const idx = y * W + x;

        if (state.frontline[idx] !== 1) continue;

        const atkId = state.owner[idx];
        const attacker = state.factions.get(atkId);
        if (!attacker || !attacker.alive || attacker.troops <= 4) continue;

        // Choose attack direction: if attacker has an objective target, prioritize moving towards target!
        let dir = dirs[rng.rangeInt(0, 3)];
        if (attacker.spearheadTarget && state.factions.has(attacker.spearheadTarget)) {
          const tgt = state.factions.get(attacker.spearheadTarget);
          if (tgt.alive) {
            const vx = tgt.capitalX - x;
            const vy = tgt.capitalY - y;
            if (Math.abs(vx) > Math.abs(vy)) {
              dir = [vx > 0 ? 1 : -1, 0];
            } else {
              dir = [0, vy > 0 ? 1 : -1];
            }
          }
        }

        const nx = x + dir[0];
        const ny = y + dir[1];
        const targetIdx = ny * W + nx;
        const defId = state.owner[targetIdx];

        if (defId === atkId) continue;

        const targetTerrain = state.terrain[targetIdx];
        // In winter, frozen ice CAN be crossed! In other seasons, river blocks
        if (targetTerrain === TERRAIN.RIVER) continue;

        let roadBonus = 1.0;
        if (targetTerrain === TERRAIN.ROAD || targetTerrain === TERRAIN.BRIDGE || targetTerrain === TERRAIN.ICE) {
          roadBonus = 3.2; // Fast conduit along roads, bridges, and winter frozen ice!
        }

        const elevDelta = (state.elevation[targetIdx] - state.elevation[idx]);
        const slopePenalty = elevDelta > 0 ? (elevDelta / 255.0) * 0.75 : 0;

        let bridgePenalty = 0;
        if (targetTerrain === TERRAIN.BRIDGE) bridgePenalty = 0.25;

        let supplyFactor = (state.supply[idx] / 100.0);

        // Spearhead Target Momentum Bonus (+60% offensive thrust)
        let objectiveBonus = 1.0;
        if (attacker.spearheadTarget === defId) {
          objectiveBonus = 1.7;
        }

        let forceAtk = (attacker.baseAtk * attacker.offensiveBonus * objectiveBonus * roadBonus * supplyFactor * rng.range(0.85, 1.4)) - slopePenalty - bridgePenalty;

        if (defId === 0) {
          // Unclaimed territory paint
          state.owner[targetIdx] = atkId;
          attacker.territory++;
          attacker.troops = Math.max(0, attacker.troops - 1);
        } else {
          // Combat clash!
          const defender = state.factions.get(defId);
          if (!defender || !defender.alive) {
            state.owner[targetIdx] = atkId;
            attacker.territory++;
            continue;
          }

          let defElevBonus = (state.elevation[targetIdx] / 255.0) * 0.5;
          if (state.difficulty === 'ironclad') defElevBonus *= 1.4;

          const defForestBonus = targetTerrain === TERRAIN.FOREST ? 0.35 : 0;
          // Defender loses morale if unsupplied or low troops
          const moraleFactor = (defender.troops < 50 ? 0.65 : 1.0) * (defender.supplyIndex / 100.0);

          const forceDef = defender.baseDef * (1.0 + defElevBonus + defForestBonus) * moraleFactor * rng.range(0.75, 1.25);

          if (rng.next() > 0.65) {
            spawnSparks(nx, ny, attacker.rgb);
          }

          if (forceAtk > forceDef) {
            // DECISIVE BREAKTHROUGH: Flip target + 2 adjacent cells to punch through stalemates!
            captureCell(targetIdx, nx, ny, atkId, defId, attacker, defender);

            // Punch through into 2 adjacent cells if force was overwhelmingly superior
            if (forceAtk > forceDef * 1.35) {
              for (const [adx, ady] of dirs) {
                const ax = nx + adx;
                const ay = ny + ady;
                if (ax >= 1 && ax < W - 1 && ay >= 1 && ay < H - 1) {
                  const aIdx = ay * W + ax;
                  if (state.owner[aIdx] === defId && state.terrain[aIdx] !== TERRAIN.RIVER) {
                    captureCell(aIdx, ax, ay, atkId, defId, attacker, defender);
                    break;
                  }
                }
              }
            }
          } else {
            attacker.troops = Math.max(0, attacker.troops - 2);
          }
        }
      }
    }

    function captureCell(cIdx, cx, cy, atkId, defId, attacker, defender) {
      defender.territory = Math.max(0, defender.territory - 1);
      defender.troops = Math.max(0, defender.troops - 2);
      attacker.troops = Math.max(0, attacker.troops - 1);

      state.owner[cIdx] = atkId;
      attacker.territory++;

      // Check if county seat or gang camp was captured!
      if (cx === defender.capitalX && cy === defender.capitalY) {
        annexCountySeat(defender.id, attacker.id);
      }
    }

    function annexCountySeat(loserId, victorId) {
      const loser = state.factions.get(loserId);
      const victor = state.factions.get(victorId);
      if (!loser || !victor) return;

      loser.alive = false;

      // Gang Defeated Victory Event!
      if (loser.isGang) {
        showFlashNotice(`🏆 OUTLAWS CLEARED: ${loser.name.toUpperCase()} ELIMINATED!`);
        if (victorId === state.playerFactionId) {
          state.playerTreasury += 100;
          victor.troops += 80;
          showFlashNotice(`💰 BOUNTY CLAIMED: +100 SUPPLIES & +80 RECRUITS!`);
          updatePlayerHUD();
        }
      } else {
        showFlashNotice(`⭐ CITADEL FALLEN: ${loser.name.toUpperCase()} ANNEXED!`);
      }

      // Absorb all remaining cells of loser
      for (let i = 0; i < TOTAL_CELLS; i++) {
        if (state.owner[i] === loserId) {
          state.owner[i] = victorId;
          victor.territory++;
        }
      }
      loser.territory = 0;

      // Check if player won or lost
      if (loserId === state.playerFactionId) {
        showFlashNotice("YOUR CITADEL WAS ANNEXED! Switched to Spectator.");
        state.playerFactionId = null;
        updatePlayerHUD();
      } else if (victorId === state.playerFactionId && !loser.isGang) {
        showFlashNotice(`🎖️ GRAND VICTORY! YOU ANNEXED ${loser.town.toUpperCase()}! (+250 🪙)`);
        state.playerTreasury += 250;
        updatePlayerHUD();
      }
    }

    function updateFrontlinesAndPocketing() {
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      state.frontline.fill(0);
      state.supply.fill(0);

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const o = state.owner[idx];
          if (o === 0) continue;

          for (const [dx, dy] of dirs) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
              if (state.owner[ny * W + nx] !== o) {
                state.frontline[idx] = 1;
                break;
              }
            }
          }
        }
      }

      state.factions.forEach(f => {
        if (!f.alive) return;
        const capIdx = f.capitalY * W + f.capitalX;
        state.supply[capIdx] = 100;

        const queue = [{ x: f.capitalX, y: f.capitalY, sup: 100 }];
        const visited = new Uint8Array(TOTAL_CELLS);
        visited[capIdx] = 1;

        let head = 0;
        let totalFrontlines = 0;

        while (head < queue.length && head < 9000) {
          const curr = queue[head++];
          const cIdx = curr.y * W + curr.x;

          if (state.frontline[cIdx] === 1) totalFrontlines++;
          if (curr.sup <= 5) continue;

          for (const [dx, dy] of dirs) {
            const nx = curr.x + dx;
            const ny = curr.y + dy;
            if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
              const nIdx = ny * W + nx;
              if (visited[nIdx] === 0 && state.owner[nIdx] === f.id) {
                visited[nIdx] = 1;
                let supLoss = 1;
                if (state.terrain[nIdx] === TERRAIN.ROAD || state.terrain[nIdx] === TERRAIN.BRIDGE || state.terrain[nIdx] === TERRAIN.ICE) {
                  supLoss = 0.2;
                }
                const nSup = Math.max(0, curr.sup - supLoss);
                state.supply[nIdx] = Math.floor(nSup);
                queue.push({ x: nx, y: ny, sup: nSup });
              }
            }
          }
        }

        f.supplyIndex = Math.min(100, Math.floor((head / Math.max(1, f.territory)) * 100));
      });

      // Pocket Starvation: doubled in winter!
      const starveChance = state.season === 'winter' ? 0.70 : 0.85;
      for (let i = 0; i < TOTAL_CELLS; i++) {
        if (state.owner[i] > 0 && state.supply[i] === 0) {
          if (rng.next() > starveChance) {
            const victim = state.factions.get(state.owner[i]);
            if (victim) victim.territory = Math.max(0, victim.territory - 1);
            state.owner[i] = 0;
          }
        }
      }
    }

    function spawnSparks(x, y, rgb) {
      for (let i = 0; i < 3; i++) {
        state.sparks.push({
          x: x + 0.5,
          y: y + 0.5,
          vx: (rng.next() - 0.5) * 1.6,
          vy: (rng.next() - 0.5) * 1.6,
          life: 0,
          maxLife: 14 + rng.rangeInt(0, 12),
          color: rng.next() > 0.4 ? '#fde047' : `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`
        });
      }
      if (state.sparks.length > 300) state.sparks.splice(0, 80);
    }

    // --- 9. RENDER LOOP (60 FPS) ---
    function renderScene() {
      mainCtx.fillStyle = '#02040a';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

      mainCtx.save();
      mainCtx.translate(mainCanvas.width / 2, mainCanvas.height / 2);
      mainCtx.scale(state.zoom, state.zoom);
      mainCtx.translate(-mainCanvas.width / 2 + state.camX, -mainCanvas.height / 2 + state.camY);

      mainCtx.imageSmoothingEnabled = false;

      // 1. Static Topographic Hillshade (Layer 1)
      mainCtx.drawImage(staticCanvas, 0, 0, mainCanvas.width, mainCanvas.height);

      // 2. Dynamic Territorial Paint (Layer 2 @ 65% opacity)
      mainCtx.globalAlpha = 0.65;
      mainCtx.drawImage(dynamicCanvas, 0, 0, mainCanvas.width, mainCanvas.height);
      mainCtx.globalAlpha = 1.0;

      // 3. Top Vector Overlays (Layer 3)
      drawVectorOverlays(mainCtx);

      mainCtx.restore();
    }

    function drawVectorOverlays(ctx) {
      const tileW = mainCanvas.width / W;
      const tileH = mainCanvas.height / H;

      // Tactical Objective Vectors (Dashed attack lines from capitals to target towns)
      state.factions.forEach(f => {
        if (!f.alive || !f.spearheadTarget) return;
        const target = state.factions.get(f.spearheadTarget);
        if (!target || !target.alive) return;

        const x1 = f.capitalX * tileW + tileW / 2;
        const y1 = f.capitalY * tileH + tileH / 2;
        const x2 = target.capitalX * tileW + tileW / 2;
        const y2 = target.capitalY * tileH + tileH / 2;

        ctx.save();
        ctx.strokeStyle = f.hex;
        ctx.lineWidth = 2.5 / state.zoom;
        ctx.setLineDash([8 / state.zoom, 6 / state.zoom]);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // Pulsating Target Crosshair at enemy capital
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2 / state.zoom;
        const crossR = 14 / state.zoom;
        ctx.beginPath();
        ctx.arc(x2, y2, crossR, 0, Math.PI * 2);
        ctx.moveTo(x2 - crossR - 4 / state.zoom, y2);
        ctx.lineTo(x2 + crossR + 4 / state.zoom, y2);
        ctx.moveTo(x2, y2 - crossR - 4 / state.zoom);
        ctx.lineTo(x2 + crossR + 4 / state.zoom);
        ctx.stroke();
        ctx.restore();
      });

      // Draw Sparks
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const p = state.sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life++;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - (p.life / p.maxLife));
        ctx.fillRect(p.x * tileW, p.y * tileH, 2.5 / state.zoom, 2.5 / state.zoom);

        if (p.life >= p.maxLife) state.sparks.splice(i, 1);
      }
      ctx.globalAlpha = 1.0;

      // County Seat & Outlaw Gang Pins
      state.factions.forEach(f => {
        if (!f.alive) return;
        const cx = f.capitalX * tileW + tileW / 2;
        const cy = f.capitalY * tileH + tileH / 2;

        const haloR = Math.max(7, 12 / state.zoom);
        ctx.beginPath();
        ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
        ctx.strokeStyle = f.hex;
        ctx.lineWidth = 1.5 / state.zoom;
        ctx.stroke();

        ctx.font = `${Math.max(11, 13 / state.zoom)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(f.isGang ? '☠️' : '⭐', cx, cy - (7 / state.zoom));

        ctx.font = `bold ${Math.max(9, 10 / state.zoom)}px ui-monospace, monospace`;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillStyle = f.id === state.playerFactionId ? '#fbbf24' : (f.isGang ? '#f87171' : '#f8fafc');
        ctx.fillText(f.town, cx, cy + (9 / state.zoom));
        ctx.shadowBlur = 0;
      });

      // Highlight Selected Faction
      if (state.selectedFactionId && state.factions.has(state.selectedFactionId)) {
        const sel = state.factions.get(state.selectedFactionId);
        const scx = sel.capitalX * tileW + tileW / 2;
        const scy = sel.capitalY * tileH + tileH / 2;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5 / state.zoom;
        ctx.strokeRect(scx - 12 / state.zoom, scy - 12 / state.zoom, 24 / state.zoom, 24 / state.zoom);
      }
    }

    function updateAllMinimaps() {
      minimapCtx.drawImage(staticCanvas, 0, 0);
      minimapCtx.globalAlpha = 0.65;
      minimapCtx.drawImage(dynamicCanvas, 0, 0);
      minimapCtx.globalAlpha = 1.0;

      const sheetCanvas = document.getElementById('sheetMinimapCanvas');
      if (sheetCanvas) {
        const sCtx = sheetCanvas.getContext('2d');
        sCtx.drawImage(minimapCanvas, 0, 0, sheetCanvas.width, sheetCanvas.height);
      }
    }

    // --- 10. ACTION & SELECTION HANDLERS ---
    function selectFaction(id) {
      if (!id || !state.factions.has(id)) {
        state.selectedFactionId = null;
        closeSelectionCard();
        return;
      }

      state.selectedFactionId = id;
      const f = state.factions.get(id);

      const dot = document.getElementById('selDot');
      dot.style.background = f.hex;
      dot.style.color = f.hex;

      document.getElementById('selName').innerText = f.isGang ? `[OUTLAW GANG] ${f.name}` : f.name;
      updateSelectedCardStats();

      const cmdBtn = document.getElementById('btnCommandSelected');
      const cmdText = document.getElementById('cmdBtnText');

      if (f.isGang) {
        cmdBtn.style.display = 'none'; // Cannot play as outlaws
      } else {
        cmdBtn.style.display = 'inline-flex';
        cmdText.innerText = f.id === state.playerFactionId ? "Relinquish (God)" : "Take Command";
      }

      const card = document.getElementById('selectionCommandCard');
      card.classList.add('show');
    }

    function updateSelectedCardStats() {
      if (!state.selectedFactionId || !state.factions.has(state.selectedFactionId)) return;
      const f = state.factions.get(state.selectedFactionId);
      const pct = ((f.territory / TOTAL_CELLS) * 100).toFixed(1);
      document.getElementById('selStats').innerText = `Territory: ${pct}% • 🪖 ${f.troops} Troops • Supply: ${f.supplyIndex}%`;
    }

    function closeSelectionCard() {
      state.selectedFactionId = null;
      document.getElementById('selectionCommandCard').classList.remove('show');
    }

    document.getElementById('btnCloseSelectionCard').addEventListener('click', closeSelectionCard);

    function updatePlayerHUD() {
      const hud = document.getElementById('playerCommandBar');
      if (state.playerFactionId && state.factions.has(state.playerFactionId)) {
        const f = state.factions.get(state.playerFactionId);
        document.getElementById('playerFactionName').innerText = f.name.toUpperCase();
        document.getElementById('playerTreasury').innerText = state.playerTreasury;

        if (f.spearheadTarget && state.factions.has(f.spearheadTarget)) {
          const tgt = state.factions.get(f.spearheadTarget);
          document.getElementById('playerObjectiveText').innerText = `[OBJ: ${tgt.town.toUpperCase()}]`;
        } else {
          document.getElementById('playerObjectiveText').innerText = "[OBJ: TAP ENEMY]";
        }
        hud.classList.add('show');
      } else {
        hud.classList.remove('show');
      }
    }

    // Command Selected Faction
    document.getElementById('btnCommandSelected').addEventListener('click', () => {
      if (!state.selectedFactionId) return;
      if (state.playerFactionId === state.selectedFactionId) {
        state.playerFactionId = null;
        showFlashNotice("SPECTATOR (GOD) MODE ENGAGED");
      } else {
        state.playerFactionId = state.selectedFactionId;
        const f = state.factions.get(state.playerFactionId);
        showFlashNotice(`ASSUMED SOVEREIGN COMMAND: ${f.name.toUpperCase()}`);
      }
      updatePlayerHUD();
      selectFaction(state.selectedFactionId);
    });

    // Target Objective Button
    document.getElementById('btnTargetObjective').addEventListener('click', () => {
      if (!state.selectedFactionId) return;
      const f = state.factions.get(state.selectedFactionId);
      setArmedTool('target', `🎯 DESIGNATE OBJECTIVE: Tap rival town or gang for ${f.town.toUpperCase()}`);
      closeSelectionCard();
    });

    // Draft +120 Troops for Selected Faction
    document.getElementById('btnDraftSelected').addEventListener('click', () => {
      if (!state.selectedFactionId) return;
      const f = state.factions.get(state.selectedFactionId);
      if (!f || !f.alive) return;

      if (state.playerFactionId === f.id && state.playerTreasury < 50) {
        showFlashNotice("INSUFFICIENT SUPPLIES (NEED 50 🪙)");
        return;
      }
      if (state.playerFactionId === f.id) {
        state.playerTreasury -= 50;
        updatePlayerHUD();
      }

      f.troops += 120;
      spawnSparks(f.capitalX, f.capitalY, [255, 255, 120]);
      showFlashNotice(`EMERGENCY MILITIA DRAFTED: +120 TROOPS`);
      updateSelectedCardStats();
      updateRoster();
    });

    // Fortify Base for Selected Faction
    document.getElementById('btnFortifySelected').addEventListener('click', () => {
      if (!state.selectedFactionId) return;
      const f = state.factions.get(state.selectedFactionId);
      if (!f || !f.alive) return;

      if (state.playerFactionId === f.id && state.playerTreasury < 60) {
        showFlashNotice("INSUFFICIENT SUPPLIES (NEED 60 🪙)");
        return;
      }
      if (state.playerFactionId === f.id) {
        state.playerTreasury -= 60;
        updatePlayerHUD();
      }

      f.baseDef += 0.35;
      const capIdx = f.capitalY * W + f.capitalX;
      state.elevation[capIdx] = Math.min(255, state.elevation[capIdx] + 45);
      bakeStaticHillshade();
      spawnSparks(f.capitalX, f.capitalY, [120, 200, 255]);
      showFlashNotice(`BASTIONS REINFORCED: ${f.town.toUpperCase()}`);
    });

    // --- 11. PRIMARY ACTION BAR DISPATCHER ---
    document.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.action;
        handlePrimaryAction(act);
      });
    });

    function handlePrimaryAction(act) {
      if (act === 'strike') {
        if (state.activeTool === 'strike') {
          setArmedTool(null);
        } else {
          setArmedTool('strike', '💥 ARTILLERY READY: Tap map sector to strike');
        }
      } else if (act === 'bridge') {
        if (state.activeTool === 'bridge') {
          setArmedTool(null);
        } else {
          setArmedTool('bridge', '🪵 PONTOON BRIDGE: Tap river tile to span');
        }
      } else if (act === 'trench') {
        if (state.activeTool === 'trench') {
          setArmedTool(null);
        } else {
          setArmedTool('trench', '🛡️ TRENCH REDOUBT: Tap sector to elevate ridge');
        }
      } else if (act === 'spearhead') {
        const actorId = state.playerFactionId || state.selectedFactionId;
        if (!actorId) {
          setArmedTool('target', '🎯 OBJECTIVE: Tap rival town or gang to direct frontline surge');
        } else {
          const f = state.factions.get(actorId);
          setArmedTool('target', `🎯 OBJECTIVE: Tap rival town or gang for ${f.town.toUpperCase()}`);
        }
      } else if (act === 'draft') {
        setArmedTool(null);
        const fId = state.playerFactionId || state.selectedFactionId;
        if (fId && state.factions.has(fId)) {
          const f = state.factions.get(fId);
          f.troops += 150;
          showFlashNotice(`+150 MILITIA DEPLOYED TO ${f.town.toUpperCase()}`);
        } else {
          state.factions.forEach(f => { if (f.alive && !f.isGang) f.troops += 100; });
          showFlashNotice("STATEWIDE MOBILIZATION: +100 TROOPS TO ALL GARRISONS");
        }
        updateRoster();
        updateSelectedCardStats();
      } else if (act === 'revolt') {
        setArmedTool(null);
        triggerRegionalRevolt();
      } else if (act === 'intel') {
        setArmedTool(null);
        openIntelDrawer();
      }
    }

    function setArmedTool(toolName, promptText = '') {
      state.activeTool = toolName;
      document.querySelectorAll('.action-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.action === toolName || (toolName === 'target' && b.dataset.action === 'spearhead'));
      });

      const banner = document.getElementById('activeToolBanner');
      if (toolName) {
        document.getElementById('activeToolText').innerText = promptText;
        banner.classList.add('show');
      } else {
        banner.classList.remove('show');
      }
    }

    document.getElementById('btnCancelTool').addEventListener('click', () => {
      setArmedTool(null);
    });

    function triggerRegionalRevolt() {
      const deadCitadels = Array.from(state.factions.values()).filter(f => !f.alive && !f.isGang);
      if (deadCitadels.length > 0) {
        const reb = deadCitadels[rng.rangeInt(0, deadCitadels.length - 1)];
        reb.alive = true;
        reb.troops = 300;
        reb.baseAtk = 1.45;
        reb.offensiveBonus = 2.5;

        const r = 18;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (Math.hypot(dx, dy) <= r) {
              const x = reb.capitalX + dx;
              const y = reb.capitalY + dy;
              if (x >= 0 && x < W && y >= 0 && y < H) {
                const idx = y * W + x;
                const old = state.owner[idx];
                if (old > 0 && state.factions.has(old)) state.factions.get(old).territory--;
                state.owner[idx] = reb.id;
                reb.territory++;
              }
            }
          }
        }
        showFlashNotice(`⚡ REVOLT: ${reb.town.toUpperCase()} CITIZENS LIBERATED!`);
      } else {
        // Mutiny in largest faction
        let largest = null;
        state.factions.forEach(f => {
          if (f.alive && !f.isGang && (!largest || f.territory > largest.territory)) largest = f;
        });
        if (largest) {
          largest.troops = Math.max(20, Math.floor(largest.troops * 0.5));
          showFlashNotice(`⚡ MUTINY: HALF OF ${largest.name.toUpperCase()} MUTINIED!`);
        }
      }

      updateFrontlinesAndPocketing();
      renderDynamicTerritoryBuffer();
      updateRoster();
    }

    // --- 12. BOTTOM SHEET (INTEL & RADAR) ---
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetContent = document.getElementById('sheetContent');

    function openIntelDrawer() {
      sheetTitle.innerText = "War Intel & Difficulty Settings";
      sheetContent.innerHTML = `
        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--amber); font-weight: 800;">
          TACTICAL DIFFICULTY:
        </div>
        <div class="diff-pill-group">
          <div class="diff-pill ${state.difficulty === 'recruit' ? 'active' : ''}" data-diff="recruit">🟢 Recruit</div>
          <div class="diff-pill ${state.difficulty === 'veteran' ? 'active' : ''}" data-diff="veteran">🟡 Veteran</div>
          <div class="diff-pill ${state.difficulty === 'ironclad' ? 'active' : ''}" data-diff="ironclad">🔴 Ironclad</div>
        </div>

        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--cyan); margin-top: 10px; font-weight: 800;">
          FACTIONS & OUTLAWS ROSTER:
        </div>
        <div id="drawerRosterList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        
        <div style="font-family: var(--font-mono); font-size: 11px; color: var(--cyan); margin-top: 10px; font-weight: 800;">
          TOPOGRAPHIC RADAR (300x300)
        </div>
        <div class="sheet-radar-container">
          <canvas id="sheetMinimapCanvas" width="300" height="300"></canvas>
        </div>
        <div style="text-align: center; font-size: 10px; font-family: var(--font-mono); color: var(--text-muted);">
          Tap radar to pan camera directly to sector
        </div>
      `;

      sheetContent.querySelectorAll('.diff-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          state.difficulty = pill.dataset.diff;
          sheetContent.querySelectorAll('.diff-pill').forEach(p => p.classList.toggle('active', p === pill));
          showFlashNotice(`DIFFICULTY SET TO: ${state.difficulty.toUpperCase()}`);
        });
      });

      updateRoster();
      updateAllMinimaps();

      const radar = document.getElementById('sheetMinimapCanvas');
      if (radar) {
        radar.addEventListener('click', e => {
          const rect = radar.getBoundingClientRect();
          const mx = (e.clientX - rect.left) / rect.width;
          const my = (e.clientY - rect.top) / rect.height;
          panTo(Math.floor(mx * W), Math.floor(my * H));
          closeSheet();
        });
      }

      sheetBackdrop.classList.add('open');
      bottomSheet.classList.add('open');
    }

    function closeSheet() {
      sheetBackdrop.classList.remove('open');
      bottomSheet.classList.remove('open');
    }

    sheetBackdrop.addEventListener('click', closeSheet);
    document.getElementById('btnCloseSheet').addEventListener('click', closeSheet);
    document.getElementById('sheetHandle').addEventListener('click', closeSheet);

    function updateRoster() {
      const living = Array.from(state.factions.values()).filter(f => f.alive);
      living.sort((a, b) => b.territory - a.territory);

      const html = living.map((f, idx) => {
        const pct = ((f.territory / TOTAL_CELLS) * 100).toFixed(1);
        const isSel = f.id === state.selectedFactionId;
        const isPlayer = f.id === state.playerFactionId;
        const tag = f.isGang ? '<span style="color: var(--rose); font-size: 9px; font-weight: 800;">[OUTLAW GANG]</span>' : (isPlayer ? '<span style="color: var(--amber); font-size: 9px; font-weight: 800;">[YOU]</span>' : '');
        return `
          <div data-id="${f.id}" class="sheet-roster-card ${f.isGang ? 'gang' : ''} ${isSel ? 'active' : ''}">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="color: #64748b; font-family: var(--font-mono); font-size: 11px; width: 14px;">#${idx + 1}</span>
              <div style="width: 12px; height: 12px; border-radius: 50%; background: ${f.hex};"></div>
              <div>
                <div style="font-weight: 700; color: #fff; font-size: 12px;">${f.town}</div>
                <div style="color: #94a3b8; font-size: 10px; font-family: var(--font-mono);">${tag} Supply: ${f.supplyIndex}%</div>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px;">
              <span style="color: var(--cyan); font-weight: 800;">${pct}%</span>
              <span>🪖 ${f.troops}</span>
            </div>
          </div>
        `;
      }).join('');

      const drawerList = document.getElementById('drawerRosterList');
      if (drawerList) {
        drawerList.innerHTML = html;
        drawerList.querySelectorAll('.sheet-roster-card').forEach(el => {
          el.addEventListener('click', () => {
            const id = parseInt(el.dataset.id);
            selectFaction(id);
            closeSheet();
            const f = state.factions.get(id);
            if (f) panTo(f.capitalX, f.capitalY);
          });
        });
      }
    }

    function panTo(x, y) {
      const tileW = mainCanvas.width / W;
      const tileH = mainCanvas.height / H;
      state.camX = (mainCanvas.width / 2) - (x * tileW);
      state.camY = (mainCanvas.height / 2) - (y * tileH);
    }

    function showFlashNotice(msg) {
      const el = document.getElementById('hudNotice');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function spawnClickRipple(x, y) {
      const r = document.createElement('div');
      r.className = 'tap-ripple';
      r.style.left = x + 'px';
      r.style.top = y + 'px';
      document.body.appendChild(r);
      setTimeout(() => r.remove(), 400);
    }

    // --- 13. CINEMA MODE ---
    function toggleCinemaMode(force) {
      const isCinema = force !== undefined ? force : !document.body.classList.contains('cinema-mode');
      document.body.classList.toggle('cinema-mode', isCinema);
      closeSheet();
      closeSelectionCard();
    }

    document.getElementById('btnCinemaToggle').addEventListener('click', () => toggleCinemaMode(true));
    document.getElementById('btnExitCinema').addEventListener('click', () => toggleCinemaMode(false));

    window.addEventListener('keydown', e => {
      if (e.key === 'c' || e.key === 'C') {
        toggleCinemaMode();
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlayPause();
      }
    });

    function togglePlayPause() {
      state.isPaused = !state.isPaused;
      document.getElementById('btnPause').innerText = state.isPaused ? '▶' : '❚❚';
    }

    document.getElementById('btnPause').addEventListener('click', togglePlayPause);

    // Speed Controls: 1x, 2x, 5x, 10x, 25x Warp Speed
    const spdMap = [
      { id: 'btnSpeed1', v: 1 },
      { id: 'btnSpeed2', v: 2 },
      { id: 'btnSpeed5', v: 5 },
      { id: 'btnSpeed10', v: 10 },
      { id: 'btnSpeed25', v: 25 }
    ];
    spdMap.forEach(s => {
      document.getElementById(s.id).addEventListener('click', () => {
        state.speed = s.v;
        state.isPaused = false;
        document.getElementById('btnPause').innerText = '❚❚';
        spdMap.forEach(o => document.getElementById(o.id).classList.toggle('active', o.v === s.v));
      });
    });

    document.getElementById('btnResetConflict').addEventListener('click', () => {
      initTheater();
    });

    // --- 14. 1:1 EXACT COORDINATE CONVERSION & TOUCH INTERACTION ---
    function getTileFromEvent(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      const mouseX = clientX - rect.left;
      const mouseY = clientY - rect.top;

      const screenCenterX = mainCanvas.width / 2;
      const screenCenterY = mainCanvas.height / 2;

      const worldX = (mouseX - screenCenterX) / state.zoom + screenCenterX - state.camX;
      const worldY = (mouseY - screenCenterY) / state.zoom + screenCenterY - state.camY;

      const tx = Math.floor((worldX / mainCanvas.width) * W);
      const ty = Math.floor((worldY / mainCanvas.height) * H);

      if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
        return { x: tx, y: ty, idx: ty * W + tx };
      }
      return null;
    }

    function findNearestCountySeat(tx, ty, tolerance = 14) {
      let nearest = null;
      let minDist = tolerance;
      state.factions.forEach(f => {
        if (!f.alive) return;
        const d = Math.hypot(f.capitalX - tx, f.capitalY - ty);
        if (d < minDist) {
          minDist = d;
          nearest = f;
        }
      });
      return nearest;
    }

    // Mouse Listeners
    mainCanvas.addEventListener('mousedown', e => {
      if (e.button === 0) {
        state.isDragging = true;
        state.dragStartX = e.clientX - state.camX;
        state.dragStartY = e.clientY - state.camY;
      }
    });

    window.addEventListener('mousemove', e => {
      if (state.isDragging) {
        state.camX = e.clientX - state.dragStartX;
        state.camY = e.clientY - state.dragStartY;
      }
    });

    window.addEventListener('mouseup', e => {
      if (state.isDragging) {
        state.isDragging = false;
        const d = Math.hypot(e.clientX - (state.dragStartX + state.camX), e.clientY - (state.dragStartY + state.camY));
        if (d < 6) handleTap(e.clientX, e.clientY);
      }
    });

    mainCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.15 : 0.85;
      state.zoom = Math.min(6.0, Math.max(0.65, state.zoom * f));
    }, { passive: false });

    // Touch Listeners for iPhone / Mobile
    mainCanvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        state.isDragging = true;
        state.dragStartX = e.touches[0].clientX - state.camX;
        state.dragStartY = e.touches[0].clientY - state.camY;
      } else if (e.touches.length === 2) {
        state.isDragging = false;
        state.touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.initialTouchZoom = state.zoom;
      }
    }, { passive: true });

    mainCanvas.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && state.isDragging) {
        state.camX = e.touches[0].clientX - state.dragStartX;
        state.camY = e.touches[0].clientY - state.dragStartY;
      } else if (e.touches.length === 2 && state.touchStartDist > 0) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = currentDist / state.touchStartDist;
        state.zoom = Math.min(6.0, Math.max(0.65, state.initialTouchZoom * scale));
      }
    }, { passive: true });

    mainCanvas.addEventListener('touchend', e => {
      if (state.isDragging && e.changedTouches.length === 1) {
        state.isDragging = false;
        const t = e.changedTouches[0];
        const d = Math.hypot(t.clientX - (state.dragStartX + state.camX), t.clientY - (state.dragStartY + state.camY));
        if (d < 8) handleTap(t.clientX, t.clientY);
      }
      if (e.touches.length < 2) {
        state.touchStartDist = 0;
      }
    }, { passive: true });

    function handleTap(clientX, clientY) {
      spawnClickRipple(clientX, clientY);
      const tile = getTileFromEvent(clientX, clientY);
      if (!tile) return;

      const nearestSeat = findNearestCountySeat(tile.x, tile.y, 14);

      // 1. Armed Tool Actions
      if (state.activeTool) {
        if (state.activeTool === 'target') {
          const targetFaction = nearestSeat ? nearestSeat.id : state.owner[tile.idx];
          const actorId = state.playerFactionId || state.selectedFactionId;
          if (actorId && targetFaction && targetFaction !== actorId && state.factions.has(targetFaction)) {
            const actor = state.factions.get(actorId);
            const target = state.factions.get(targetFaction);
            actor.spearheadTarget = target.id;
            actor.offensiveBonus = 2.4;
            showFlashNotice(`🎯 OBJECTIVE DESIGNATED: ${actor.town.toUpperCase()} ➔ ${target.town.toUpperCase()}`);
            setArmedTool(null);
            updatePlayerHUD();
            return;
          } else {
            showFlashNotice("TAP A RIVAL TOWN OR OUTLAW GANG TO TARGET");
            return;
          }
        }

        applyArmedTool(tile.x, tile.y);
        return;
      }

      // 2. Default: Inspect clicked county seat, gang, or sector
      if (nearestSeat) {
        selectFaction(nearestSeat.id);
      } else {
        const ownerId = state.owner[tile.idx];
        if (ownerId > 0 && state.factions.has(ownerId)) {
          selectFaction(ownerId);
        } else {
          closeSelectionCard();
        }
      }
    }

    function applyArmedTool(tx, ty) {
      const idx = ty * W + tx;

      if (state.activeTool === 'strike') {
        const r = 5;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const x = tx + dx;
            const y = ty + dy;
            if (x >= 0 && x < W && y >= 0 && y < H) {
              const i = y * W + x;
              const o = state.owner[i];
              if (o > 0 && state.factions.has(o)) state.factions.get(o).territory--;
              state.owner[i] = 0;
              spawnSparks(x, y, [255, 120, 60]);
            }
          }
        }
        showFlashNotice("💥 SECTOR DECIMATED BY HEAVY ARTILLERY");
        bakeStaticHillshade();
      } else if (state.activeTool === 'bridge') {
        if (state.terrain[idx] === TERRAIN.RIVER || state.terrain[idx] === TERRAIN.ICE) {
          state.terrain[idx] = TERRAIN.BRIDGE;
          state.baseTerrain[idx] = TERRAIN.BRIDGE;
          showFlashNotice("🪵 PONTOON BRIDGE SPANNED");
          bakeStaticHillshade();
        } else {
          showFlashNotice("CAN ONLY CONSTRUCT BRIDGE OVER WATER");
        }
      } else if (state.activeTool === 'trench') {
        state.elevation[idx] = Math.min(255, state.elevation[idx] + 70);
        showFlashNotice("🛡️ RIDGE TRENCH ELEVATED (+DEFENSE)");
        bakeStaticHillshade();
      }

      setArmedTool(null);
      renderDynamicTerritoryBuffer();
      updateAllMinimaps();
    }

    // --- 15. RESPONSIVE RESIZE (1:1 Unified Coordinates) ---
    function resizeCanvas() {
      mainCanvas.width = window.innerWidth;
      mainCanvas.height = window.innerHeight;
      mainCanvas.style.width = window.innerWidth + 'px';
      mainCanvas.style.height = window.innerHeight + 'px';
      renderScene();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => {
      setTimeout(resizeCanvas, 200);
    });

    let lastSimTime = 0;
    function loop(now) {
      if (!state.isPaused) {
        const interval = 1000 / (18 * state.speed);
        if (now - lastSimTime >= interval) {
          stepSimulation();
          lastSimTime = now;
        }
      }

      renderScene();
      requestAnimationFrame(loop);
    }

    // Startup Initialization
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      initTheater();
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
