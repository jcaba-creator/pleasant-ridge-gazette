<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ages of Constant Conflict: Regional Conflict</title>
  <style>
    :root {
      --bg: #03060f;
      --card-bg: rgba(9, 14, 28, 0.94);
      --card-border: rgba(56, 189, 248, 0.28);
      --card-border-active: #38bdf8;
      --cyan: #38bdf8;
      --amber: #fbbf24;
      --rose: #f43f5e;
      --emerald: #34d399;
      --purple: #c084fc;
      --winter-ice: #a5f3fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* ================= 1. VIEWPORT & CANVASES ================= */
    #viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040a;
      z-index: 1;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: crosshair;
    }

    /* Tap feedback ripple */
    .tap-ripple {
      position: fixed;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      pointer-events: none;
      z-index: 9999;
      animation: rippleAnim 0.35s ease-out forwards;
    }

    @keyframes rippleAnim {
      0% { transform: scale(0.3); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    /* ================= 2. MINIMALIST TOP NAV BAR ================= */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 10px;
      padding-top: env(safe-area-inset-top, 0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(3, 6, 15, 0.98) 0%, rgba(3, 6, 15, 0.85) 80%, transparent 100%);
      z-index: 80;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    header > * {
      pointer-events: auto;
    }

    body.cinema-mode header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .arcade-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--card-border);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .title-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
    }

    .title-text span {
      color: var(--cyan);
      font-weight: 400;
    }

    /* Playback & Controls */
    .playback-capsule {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(9, 14, 28, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 2px 4px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 5px 7px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      color: #030712;
      background: var(--cyan);
    }

    .sim-clock-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--amber);
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 6px;
      padding: 4px 7px;
      white-space: nowrap;
    }

    .season-tag {
      font-size: 11px;
    }

    .cinema-btn {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 9px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .cinema-btn:hover {
      color: #fff;
      border-color: var(--cyan);
    }

    /* Exit Cinema Pill */
    #btnExitCinema {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100;
      background: rgba(9, 14, 28, 0.95);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      touch-action: manipulation;
    }

    body.cinema-mode #btnExitCinema {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= 3. SOVEREIGN PLAYER HUD BANNER ================= */
    #playerCommandBar {
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 95vw;
      max-width: 620px;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(9, 14, 28, 0.95);
      border: 1px solid var(--amber);
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.25);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      z-index: 75;
      display: none;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
    }

    #playerCommandBar.show {
      display: flex;
    }

    .treasury-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--amber);
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* Active Tool Banner */
    #activeToolBanner {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 7px 16px;
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--cyan);
      box-shadow: 0 6px 24px rgba(56, 189, 248, 0.4);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      z-index: 85;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #activeToolBanner.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    #activeToolBanner .cancel-tool-btn {
      background: rgba(244, 63, 94, 0.25);
      border: 1px solid var(--rose);
      color: var(--rose);
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 10px;
      cursor: pointer;
    }

    /* Flash Notice Banner */
    #hudNotice {
      position: fixed;
      top: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(9, 14, 28, 0.96);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 90;
      white-space: nowrap;
    }

    #hudNotice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ================= 4. MASTER BOTTOM ACTION DECK ================= */
    .master-action-deck {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 96vw;
      max-width: 640px;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    body.cinema-mode .master-action-deck {
      transform: translateX(-50%) translateY(140px);
      opacity: 0;
      pointer-events: none;
    }

    /* 4A. Selected Faction / Sovereign Tactical Card */
    #selectionCommandCard {
      pointer-events: auto;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--cyan);
      border-radius: 14px;
      padding: 10px 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.75), 0 0 16px rgba(56, 189, 248, 0.2);
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: cardSlideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #selectionCommandCard.show {
      display: flex;
    }

    .sel-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sel-card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .sel-badge-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 8px currentColor;
    }

    .sel-title-text {
      font-weight: 800;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sel-status-text {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .sel-card-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .sel-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .cmd-act-btn {
      flex: 1;
      min-width: 95px;
      height: 38px;
      padding: 0 8px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .cmd-act-btn:hover, .cmd-act-btn:active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
    }

    .cmd-act-btn.primary {
      background: var(--cyan);
      color: #030712;
      border-color: var(--cyan);
      font-weight: 800;
    }

    .cmd-act-btn.gold {
      background: var(--amber);
      color: #030712;
      border-color: var(--amber);
      font-weight: 800;
    }

    /* 4B. Primary Tactile Action Bar (Permanently visible) */
    .primary-action-bar {
      pointer-events: auto;
      width: 100%;
      background: rgba(9, 14, 28, 0.94);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 4px 6px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .action-btn {
      flex: 1;
      min-width: 58px;
      height: 44px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: 22px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      white-space: nowrap;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .action-btn span:first-child {
      font-size: 15px;
      line-height: 1;
    }

    .action-btn span:last-child {
      font-size: 9px;
      letter-spacing: 0.3px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .action-btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    /* ================= 5. SLIDE-UP DRAWER (INTEL, RADAR & SETTINGS) ================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      z-index: 110;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 84vh;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border-active);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 12px 16px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 44px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 0 auto;
      cursor: pointer;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sheet-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
    }

    .sheet-content {
      overflow-y: auto;
      max-height: 62vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sheet-roster-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sheet-roster-card:hover, .sheet-roster-card.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
    }

    .sheet-roster-card.gang {
      border-color: rgba(244, 63, 94, 0.35);
      background: rgba(244, 63, 94, 0.05);
    }

    .diff-pill-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .diff-pill {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .diff-pill.active {
      border-color: var(--amber);
      color: #030712;
      background: var(--amber);
    }

    /* Radar Canvas inside Drawer */
    .sheet-radar-container {
      width: 100%;
      aspect-ratio: 1;
      max-width: 320px;
      margin: 0 auto;
      background: #000;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
    }

    .sheet-radar-container canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 500px) {
      .title-text span {
        display: none;
      }
      .action-btn {
        min-width: 48px;
        height: 42px;
      }
      .action-btn span:first-child {
        font-size: 14px;
      }
      .action-btn span:last-child {
        font-size: 8.5px;
      }
    }
  </style>
</head>
<body>

  <!-- ================= 1. VIEWPORT ================= -->
  <div id="viewport">
    <canvas id="mainCanvas"></canvas>
  </div>

  <!-- ================= 2. TOP COMMAND HEADER ================= -->
  <header>
    <div class="brand-group">
      <a href="index.html" class="arcade-back-btn" title="Back to Arcade">
        <span>◀</span> <span>Arcade</span>
      </a>
      <div class="live-pulse"></div>
      <div class="title-text">
        Conflict <span>Regional</span>
      </div>
    </div>

    <!-- Center Sim Controls with Warp Speed (1x, 2x, 5x, 10x, 25x) -->
    <div class="playback-capsule">
      <button id="btnPause" class="ctrl-btn" title="Pause / Play (Space)">❚❚</button>
      <button id="btnSpeed1" class="ctrl-btn active" title="1x Speed">1x</button>
      <button id="btnSpeed2" class="ctrl-btn" title="2x Speed">2x</button>
      <button id="btnSpeed5" class="ctrl-btn" title="5x Speed">5x</button>
      <button id="btnSpeed10" class="ctrl-btn" title="10x Fast Speed">10x</button>
      <button id="btnSpeed25" class="ctrl-btn" title="25x Warp Speed">25x</button>
    </div>

    <!-- Right Controls: Sim Year & Season -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <div class="sim-clock-badge" id="simClock">
        <span class="season-tag" id="seasonIcon">🌱</span>
        <span id="simDateText">Y1 • Spring</span>
      </div>
      <button id="btnResetConflict" class="cinema-btn" title="Generate New Conflict Map">🔄</button>
      <button id="btnCinemaToggle" class="cinema-btn" title="Cinema Mode (C)">🎬</button>
    </div>
  </header>

  <!-- Exit Cinema Mode Button -->
  <button id="btnExitCinema">
    <span>✕</span> <span>Exit Cinema</span>
  </button>

  <!-- Sovereign Player Command HUD (Active when commanding a faction) -->
  <div id="playerCommandBar">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="color: var(--amber); font-weight: 800;">👑</span>
      <span id="playerFactionName" style="font-weight: 800; color: #fff;">LEAVENWORTH CITADEL</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="treasury-pill">
        <span>🪙</span> <span id="playerTreasury">150</span>
      </div>
      <span id="playerObjectiveText" style="color: var(--cyan); font-size: 10px;">[OBJ: TAP ENEMY]</span>
    </div>
  </div>

  <!-- Active Tool Banner -->
  <div id="activeToolBanner">
    <span id="activeToolText">💥 ARTILLERY READY: Tap map to strike</span>
    <button class="cancel-tool-btn" id="btnCancelTool">Cancel</button>
  </div>

  <!-- Flash Notification Notice -->
  <div id="hudNotice">REGIONAL THEATER INITIALIZED</div>

  <!-- ================= 3. MASTER BOTTOM ACTION DECK ================= -->
  <div class="master-action-deck">
    
    <!-- 3A. Selected Faction Command Card (Pops up when a faction, gang, or county is tapped) -->
    <div id="selectionCommandCard">
      <div class="sel-card-header">
        <div class="sel-card-title-group">
          <div class="sel-badge-dot" id="selDot"></div>
          <div>
            <div class="sel-title-text" id="selName">Leavenworth Citadel</div>
            <div class="sel-status-text" id="selStats">Territory: 16.4% • 🪖 240 Troops • Supply: 96%</div>
          </div>
        </div>
        <button class="sel-card-close" id="btnCloseSelectionCard">✕</button>
      </div>

      <div class="sel-card-actions">
        <button class="cmd-act-btn gold" id="btnCommandSelected">
          <span>👑</span> <span id="cmdBtnText">Take Command</span>
        </button>
        <button class="cmd-act-btn primary" id="btnTargetObjective">
          <span>🎯</span> <span>Set Objective</span>
        </button>
