<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ages of Constant Conflict: Regional Conflict</title>
  <style>
    :root {
      --bg: #060911;
      --card-bg: rgba(12, 17, 30, 0.92);
      --card-border: rgba(56, 189, 248, 0.22);
      --card-border-active: rgba(56, 189, 248, 0.6);
      --cyan: #38bdf8;
      --amber: #fbbf24;
      --rose: #f43f5e;
      --emerald: #34d399;
      --purple: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 2px; }

    /* ================= 1. VIEWPORT & CANVASES ================= */
    #viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03050a;
      z-index: 1;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      cursor: grab;
    }

    #mainCanvas:active {
      cursor: grabbing;
    }

    /* ================= 2. MINIMALIST TOP NAV BAR ================= */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 12px;
      padding-top: env(safe-area-inset-top, 0);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(6, 9, 17, 0.95) 0%, rgba(6, 9, 17, 0.75) 80%, transparent 100%);
      z-index: 30;
      pointer-events: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    header > * {
      pointer-events: auto;
    }

    body.cinema-mode header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arcade-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .title-text {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
    }

    .title-text span {
      color: var(--cyan);
      font-weight: 400;
    }

    /* Playback & Controls */
    .playback-capsule {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(12, 17, 30, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2px 6px;
      backdrop-filter: blur(10px);
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .pill-btn.active {
      background: var(--cyan);
      color: #030712;
      font-weight: 900;
    }

    .cinema-toggle-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .cinema-toggle-btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Floating Exit Cinema Pill */
    #btnExitCinema {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      z-index: 50;
      display: none;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    body.cinema-mode #btnExitCinema {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= 3. MOBILE FLOATING ACTION DOCK (BOTTOM) ================= */
    .mobile-bottom-dock {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(12, 17, 30, 0.9);
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 30px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 25;
      max-width: 95vw;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    body.cinema-mode .mobile-bottom-dock {
      transform: translateX(-50%) translateY(100px);
      opacity: 0;
      pointer-events: none;
    }

    .dock-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid transparent;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .dock-pill:hover, .dock-pill.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* ================= 4. SLIDE-UP BOTTOM SHEET / DRAWER ================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 75vh;
      background: rgba(12, 17, 30, 0.96);
      border-top: 1px solid var(--card-border-active);
      border-radius: 20px 20px 0 0;
      padding: 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      z-index: 45;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(20px);
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      margin: 0 auto 4px auto;
      cursor: pointer;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .sheet-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 8px;
    }

    /* Roster inside Sheet */
    .sheet-roster-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 45vh;
    }

    .sheet-roster-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .sheet-roster-card:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
    }

    .sheet-roster-card.active {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.2);
    }

    /* Interventions Grid */
    .sheet-tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tactical-tool-btn {
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .tactical-tool-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
    }

    .tactical-tool-btn.active {
      background: var(--cyan);
      color: #030712;
      border-color: #ffffff;
    }

    .tactical-tool-btn.active .tool-sub {
      color: #030712;
    }

    .tool-sub {
      font-size: 9px;
      color: var(--text-muted);
    }

    /* Radar / Minimap inside Sheet */
    .sheet-radar-container {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid var(--card-border-active);
      overflow: hidden;
      position: relative;
    }

    #sheetMinimapCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ================= 5. DESKTOP FLOATING SIDEBARS (HIDDEN ON MOBILE) ================= */
    .desktop-sidebar {
      position: absolute;
      top: 56px;
      bottom: 60px;
      width: 290px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 20;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .desktop-sidebar.left { left: 12px; }
    .desktop-sidebar.right { right: 12px; }

    .desktop-sidebar > * {
      pointer-events: auto;
    }

    body.cinema-mode .desktop-sidebar.left {
      transform: translateX(-340px);
      opacity: 0;
    }

    body.cinema-mode .desktop-sidebar.right {
      transform: translateX(340px);
      opacity: 0;
    }

    @media (max-width: 768px) {
      /* Mobile / iPhone Viewport: Completely suppress desktop sidebars */
      .desktop-sidebar {
        display: none !important;
      }
      .title-text span {
        display: none;
      }
    }

    @media (min-width: 769px) {
      /* On Desktop: Hide bottom sheet pills, sidebars are visible */
      .mobile-bottom-dock {
        display: none !important;
      }
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(14px);
    }

    /* Flash Notice Banner */
    #hudNotice {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(12, 17, 30, 0.95);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 60;
    }

    #hudNotice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Inspection Card Popup (Bottom of Map) */
    #selectionCard {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border-active);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 28;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.7);
      transition: all 0.25s ease;
      font-family: var(--font-mono);
      font-size: 11px;
      max-width: 90vw;
    }

    #selectionCard.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ================= 1. MINIMALIST TOP NAV ================= -->
  <header>
    <div class="brand-group">
      <a href="index.html" class="arcade-back-btn" title="Back to Arcade">
        <span>‹</span> <span>Arcade</span>
      </a>
      <div class="live-pulse"></div>
      <div class="title-text">Constant Conflict <span>// Regional</span></div>
    </div>

    <!-- Center Speed Capsule -->
    <div class="playback-capsule">
      <button id="btnPause" class="pill-btn" title="Pause / Play (Space)">❚❚</button>
      <button id="btnSpeed1" class="pill-btn active">1x</button>
      <button id="btnSpeed2" class="pill-btn">2x</button>
      <button id="btnSpeed5" class="pill-btn">5x</button>
    </div>

    <!-- Right Quick Controls -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <button id="btnCinemaToggle" class="cinema-toggle-btn" title="Toggle Cinema Mode (Hotkey: C)">
        <span>🎬</span> <span>Cinema</span>
      </button>
    </div>
  </header>

  <!-- ================= 2. VIEWPORT & MAIN CANVAS ================= -->
  <main id="viewport">
    <canvas id="mainCanvas"></canvas>
  </main>

  <!-- Cinema Mode Exit Floating Pill -->
  <button id="btnExitCinema">
    <span>✕</span> <span>Exit Cinema Mode</span>
  </button>

  <!-- Selected Territory Floating Card -->
  <div id="selectionCard">
    <div id="selDot" style="width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); flex-shrink: 0;"></div>
    <div style="flex: 1; min-width: 0;">
      <div id="selName" style="font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Leavenworth Citadel</div>
      <div id="selStats" style="font-size: 10px; color: var(--text-muted);">Territory: 14.2% &bull; Troops: 210 &bull; Supply: 94%</div>
    </div>
    <button id="btnCommandSelected" style="background: var(--cyan); color: #030712; border: none; padding: 5px 10px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 10px; font-family: var(--font-mono);">
      Take Command
    </button>
  </div>

  <!-- ================= 3. MOBILE FLOATING ACTION DOCK ================= -->
  <nav class="mobile-bottom-dock">
    <button class="dock-pill" data-sheet="roster">
      <span>📊</span> <span>Factions</span>
    </button>
    <button class="dock-pill" data-sheet="radar">
      <span>🗺️</span> <span>Radar</span>
    </button>
    <button class="dock-pill" data-sheet="powers">
      <span>⚡</span> <span>Powers</span>
    </button>
    <button class="dock-pill" data-sheet="settings">
      <span>⚙️</span> <span>Theater</span>
    </button>
  </nav>

  <!-- ================= 4. SLIDE-UP BOTTOM SHEET DRAWER ================= -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Regional Factions</div>
      <button class="sheet-close-btn" id="btnCloseSheet">&times;</button>
    </div>

    <!-- Sheet Content Body (Dynamic) -->
    <div id="sheetContent"></div>
  </div>

  <!-- ================= 5. DESKTOP FLOATING SIDEBARS ================= -->
  <!-- Desktop Left Sidebar -->
  <aside class="desktop-sidebar left">
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
        <span style="font-family: var(--font-mono); font-size: 11px; font-weight: 800; text-transform: uppercase;">Regional Combatants</span>
        <span id="deskCombatantCount" style="font-family: var(--font-mono); font-size: 10px; color: var(--cyan);">6 Factions</span>
      </div>
      <div class="sheet-roster-list" id="desktopRosterList" style="max-height: 280px;"></div>
    </div>
  </aside>

  <!-- Desktop Right Sidebar -->
  <aside class="desktop-sidebar right">
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px;">
        <span style="font-family: var(--font-mono); font-size: 11px; font-weight: 800; text-transform: uppercase;">Topographic Radar</span>
        <span style="font-family: var(--font-mono); font-size: 10px; color: var(--text-muted);">300x300</span>
      </div>
      <div class="sheet-radar-container" style="max-width: 260px;">
        <canvas id="desktopMinimapCanvas" width="300" height="300"></canvas>
      </div>
    </div>

    <div class="glass-card" style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: var(--font-mono); font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted);">God Interventions</span>
      <div class="sheet-tools-grid">
        <button class="tactical-tool-btn" data-tool="bombard">
          <span>💥 Bombard</span>
          <span class="tool-sub">Decimate sector</span>
        </button>
        <button class="tactical-tool-btn" data-tool="bridge">
          <span>🪵 Bridge</span>
          <span class="tool-sub">Span river tile</span>
        </button>
        <button class="tactical-tool-btn" data-tool="supply">
          <span>📦 Airdrop</span>
          <span class="tool-sub">+100 Sector supply</span>
        </button>
        <button class="tactical-tool-btn" data-tool="fortify">
          <span>🛡️ Redoubt</span>
          <span class="tool-sub">+Elevation ridge</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Notification Banner -->
  <div id="hudNotice">WARGAME DEPLOYED</div>

  <!-- ================= SIMULATION SCRIPT ENGINE ================= -->
  <script>
    /**
     * AGES OF CONSTANT CONFLICT: REGIONAL CONFLICT
     * Mobile-first 300x300 Grand-Strategy Cellular Engine
     * Zero External Runtime Dependencies
     */

    // --- 1. PRNG & NOISE ---
    class PRNG {
      constructor(seed = 123456) {
        this.seed = typeof seed === 'string' ? this.hash(seed) : seed;
      }
      hash(s) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < s.length; i++) {
          h = Math.imul(h ^ s.charCodeAt(i), 16777619);
        }
        return h >>> 0;
      }
      next() {
        this.seed = (Math.imul(1103515245, this.seed) + 12345) >>> 0;
        return (this.seed & 0x7fffffff) / 2147483648;
      }
      range(min, max) { return min + this.next() * (max - min); }
      rangeInt(min, max) { return Math.floor(this.range(min, max + 1)); }
    }

    class PerlinNoise {
      constructor(prng) {
        this.p = new Uint8Array(512);
        const perm = new Uint8Array(256);
        for (let i = 0; i < 256; i++) perm[i] = i;
        for (let i = 255; i > 0; i--) {
          const j = Math.floor(prng.next() * (i + 1));
          [perm[i], perm[j]] = [perm[j], perm[i]];
        }
        for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
      }
      fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
      lerp(t, a, b) { return a + t * (b - a); }
      grad(h, x, y) {
        const u = (h & 4) === 0 ? x : y;
        const v = (h & 4) === 0 ? y : x;
        return ((h & 1) ? -u : u) + ((h & 2) ? -2.0 * v : 2.0 * v);
      }
      noise2D(x, y) {
        const X = Math.floor(x) & 255;
        const Y = Math.floor(y) & 255;
        const xf = x - Math.floor(x);
        const yf = y - Math.floor(y);
        const u = this.fade(xf);
        const v = this.fade(yf);

        const aa = this.p[this.p[X] + Y];
        const ab = this.p[this.p[X] + Y + 1];
        const ba = this.p[this.p[X + 1] + Y];
        const bb = this.p[this.p[X + 1] + Y + 1];

        const x1 = this.lerp(u, this.grad(aa, xf, yf), this.grad(ba, xf - 1, yf));
        const x2 = this.lerp(u, this.grad(ab, xf, yf - 1), this.grad(bb, xf - 1, yf - 1));
        return (this.lerp(v, x1, x2) + 1) * 0.5;
      }
      octaves(x, y, oct = 4, persistence = 0.5) {
        let total = 0, freq = 1, amp = 1, maxAmp = 0;
        for (let i = 0; i < oct; i++) {
          total += this.noise2D(x * freq, y * freq) * amp;
          maxAmp += amp;
          amp *= persistence;
          freq *= 2;
        }
        return total / maxAmp;
      }
    }

    // --- 2. ENGINE CONSTANTS & TYPED ARRAYS ---
    const W = 300;
    const H = 300;
    const TOTAL_CELLS = 90000;

    const TERRAIN = {
      FIELD: 0,
      FOREST: 1,
      RIVER: 2,
      ROAD: 3,
      BRIDGE: 4
    };

    // Regional Watershed County Seats & Factions
    const REGIONAL_COUNTIES = [
      { id: 1, name: "Leavenworth Citadel", hex: "#2563eb", rgb: [37, 99, 235], baseAtk: 1.25, baseDef: 1.45, town: "Leavenworth" },
      { id: 2, name: "Atchison River Barons", hex: "#0891b2", rgb: [8, 145, 178], baseAtk: 1.30, baseDef: 1.25, town: "Atchison" },
      { id: 3, name: "Oskaloosa Coalition", hex: "#16a34a", rgb: [22, 163, 74], baseAtk: 1.20, baseDef: 1.40, town: "Oskaloosa" },
      { id: 4, name: "Lansing Ironclad", hex: "#dc2626", rgb: [220, 38, 38], baseAtk: 1.45, baseDef: 1.05, town: "Lansing" },
      { id: 5, name: "Easton Rangers", hex: "#d97706", rgb: [217, 119, 6], baseAtk: 1.40, baseDef: 1.15, town: "Easton" },
      { id: 6, name: "Tonganoxie Guard", hex: "#9333ea", rgb: [147, 51, 234], baseAtk: 1.25, baseDef: 1.30, town: "Tonganoxie" }
    ];

    const state = {
      // 90,000 Flat Typed Arrays
      elevation: new Uint8Array(TOTAL_CELLS), // 0-255
      terrain: new Uint8Array(TOTAL_CELLS),   // 0=field, 1=forest, 2=river, 3=road, 4=bridge
      owner: new Uint8Array(TOTAL_CELLS),     // 0=unclaimed, 1..N = County ID
      frontline: new Uint8Array(TOTAL_CELLS), // 0=interior, 1=frontline
      supply: new Uint8Array(TOTAL_CELLS),    // 0-100 cellular diffusion

      // Factions Map
      factions: new Map(),
      selectedFactionId: null,
      playerFactionId: null, // null = God Mode

      // Frontline sparks
      sparks: [],

      // Time & Speed
      ticks: 0,
      speed: 1,
      isPaused: false,

      // Camera State
      camX: 0,
      camY: 0,
      zoom: 1.0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,

      // Touch State (Pinch-to-zoom)
      touchStartDist: 0,
      initialTouchZoom: 1.0,

      activeTool: null,
      seed: "EASTON-WATERSHED-2026"
    };

    // --- 3. CANVASES ---
    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d', { alpha: false });

    // Layer 1: Static Baked Background Canvas (Hillshade + Biomes + Roads)
    const staticCanvas = document.createElement('canvas');
    staticCanvas.width = W;
    staticCanvas.height = H;
    const staticCtx = staticCanvas.getContext('2d', { alpha: false });

    // Layer 2: Dynamic Territorial Paint Buffer
    const dynamicCanvas = document.createElement('canvas');
    dynamicCanvas.width = W;
    dynamicCanvas.height = H;
    const dynamicCtx = dynamicCanvas.getContext('2d', { willReadFrequently: true });
    const territoryImageData = dynamicCtx.createImageData(W, H);

    // Layer 3: Minimap Offscreen
    const minimapCanvas = document.createElement('canvas');
    minimapCanvas.width = W;
    minimapCanvas.height = H;
    const minimapCtx = minimapCanvas.getContext('2d');

    let rng = new PRNG(state.seed);

    // --- 4. TOPOGRAPHIC & WATERSHED GENERATOR ---
    function initTheater(seed = null) {
      state.seed = seed || ("THEATER-" + Math.floor(Math.random() * 999999));
      rng = new PRNG(state.seed);

      state.ticks = 0;
      state.sparks = [];
      state.factions.clear();
      state.selectedFactionId = null;
      state.playerFactionId = null;
      state.activeTool = null;

      state.elevation.fill(0);
      state.terrain.fill(TERRAIN.FIELD);
      state.owner.fill(0);
      state.frontline.fill(0);
      state.supply.fill(0);

      const perlin = new PerlinNoise(rng);

      // 1. Generate Realistic Elevation with River Valleys & Ridge Bluffs
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const nx = x / W;
          const ny = y / H;

          // Grand river bluffs on east (Missouri River corridor)
          const bluffNoise = perlin.octaves(x * 0.015, y * 0.015, 5, 0.55);
          const valleyTrough = Math.sin(ny * Math.PI) * 0.15;
          const hNorm = bluffNoise * 0.75 + valleyTrough;

          const hVal = Math.min(255, Math.max(0, Math.floor(hNorm * 255)));
          state.elevation[idx] = hVal;

          // Timbered forests on high ridges
          const veg = perlin.noise2D(x * 0.035, y * 0.035);
          if (veg > 0.60 && hVal > 60) {
            state.terrain[idx] = TERRAIN.FOREST;
          }
        }
      }

      // 2. Carve Grand River & Tributaries (Stranger Creek & Delaware)
      carveRivers(perlin);

      // 3. Establish Historical County Seats
      spawnCountySeats();

      // 4. Construct OpenStreetMap-style Highway Conduits
      buildHighwayNetwork();

      // 5. Bake Layer 1: Static Topography & Hillshade
      bakeStaticHillshade();

      // Initial Frontlines & Supply Diffusion
      updateFrontlinesAndPocketing();
      renderDynamicTerritoryBuffer();
      updateAllMinimaps();
      updateRoster();

      showFlashNotice("REGIONAL WATERSHED SIMULATION READY");
    }

    function carveRivers(perlin) {
      // 1. Grand Eastern River (Missouri River Corridor)
      let mx = W * 0.82;
      for (let y = 0; y < H; y++) {
        mx += (perlin.noise2D(y * 0.02, 1.5) - 0.5) * 3;
        mx = Math.max(W * 0.70, Math.min(W - 4, mx));

        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const tx = Math.floor(mx) + dx;
            const ty = y + dy;
            if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
              const idx = ty * W + tx;
              state.terrain[idx] = TERRAIN.RIVER;
              state.elevation[idx] = Math.max(5, state.elevation[idx] - 35);
            }
          }
        }
      }

      // 2. Stranger Creek (Central Meandering Valley)
      let sx = W * 0.45;
      for (let y = 0; y < H; y++) {
        sx += (perlin.noise2D(y * 0.025, 8.2) - 0.5) * 4;
        sx = Math.max(W * 0.25, Math.min(W * 0.65, sx));

        for (let dx = -1; dx <= 1; dx++) {
          const tx = Math.floor(sx) + dx;
          if (tx >= 0 && tx < W && y >= 0 && y < H) {
            const idx = y * W + tx;
            state.terrain[idx] = TERRAIN.RIVER;
            state.elevation[idx] = Math.max(5, state.elevation[idx] - 25);
          }
        }
      }
    }

    function spawnCountySeats() {
      // Coordinated spatial distribution across watershed
      const baseCoords = [
        { x: 215, y: 110 }, // Leavenworth
        { x: 195, y: 35 },  // Atchison
        { x: 75,  y: 130 }, // Oskaloosa
        { x: 235, y: 210 }, // Lansing
        { x: 135, y: 95 },  // Easton
        { x: 120, y: 245 }  // Tonganoxie
      ];

      REGIONAL_COUNTIES.forEach((def, i) => {
        const c = baseCoords[i % baseCoords.length];
        const cx = Math.max(15, Math.min(W - 16, c.x + rng.rangeInt(-10, 10)));
        const cy = Math.max(15, Math.min(H - 16, c.y + rng.rangeInt(-10, 10)));

        const f = {
          id: def.id,
          name: def.name,
          town: def.town,
          hex: def.hex,
          rgb: def.rgb,
          baseAtk: def.baseAtk,
          baseDef: def.baseDef,
          capitalX: cx,
          capitalY: cy,
          territory: 0,
          frontlineCells: 0,
          troops: 160 + rng.rangeInt(0, 40),
          supplyIndex: 100,
          alive: true
        };

        state.factions.set(def.id, f);

        // Seed 7-cell initial enclave
        const r = 7;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            if (Math.hypot(dx, dy) <= r) {
              const tx = cx + dx;
              const ty = cy + dy;
              if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
                const idx = ty * W + tx;
                if (state.terrain[idx] !== TERRAIN.RIVER) {
                  state.owner[idx] = def.id;
                  f.territory++;
                }
              }
            }
          }
        }
      });
    }

    function buildHighwayNetwork() {
      const towns = Array.from(state.factions.values()).map(f => ({ x: f.capitalX, y: f.capitalY }));

      towns.forEach((t1, i) => {
        // Connect each town to its nearest two partner towns
        const sorted = towns
          .filter((_, j) => i !== j)
          .sort((a, b) => Math.hypot(t1.x - a.x, t1.y - a.y) - Math.hypot(t1.x - b.x, t1.y - b.y))
          .slice(0, 2);

        sorted.forEach(t2 => {
          layPavedHighway(t1.x, t1.y, t2.x, t2.y);
        });
      });
    }

    function layPavedHighway(x0, y0, x1, y1) {
      let dx = Math.abs(x1 - x0);
      let dy = Math.abs(y1 - y0);
      let sx = (x0 < x1) ? 1 : -1;
      let sy = (y0 < y1) ? 1 : -1;
      let err = dx - dy;

      while (true) {
        if (x0 >= 0 && x0 < W && y0 >= 0 && y0 < H) {
          const idx = y0 * W + x0;
          if (state.terrain[idx] === TERRAIN.RIVER) {
            state.terrain[idx] = TERRAIN.BRIDGE; // Strategic bridge crossing!
          } else {
            state.terrain[idx] = TERRAIN.ROAD;
          }
        }
        if (x0 === x1 && y0 === y1) break;
        let e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
      }
    }

    // --- 5. STATIC BAKED HILLSHADE (LAYER 1) ---
    function bakeStaticHillshade() {
      const imgData = staticCtx.createImageData(W, H);
      const data = imgData.data;

      // Northwest illumination (sun azimuth 315 deg, altitude 45 deg)
      const sunX = -0.7071;
      const sunY = -0.7071;
      const sunZ = 1.0;
      const len = Math.hypot(sunX, sunY, sunZ);
      const lx = sunX / len;
      const ly = sunY / len;
      const lz = sunZ / len;

      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const px = idx * 4;

          const left = state.elevation[y * W + Math.max(0, x - 1)];
          const right = state.elevation[y * W + Math.min(W - 1, x + 1)];
          const up = state.elevation[Math.max(0, y - 1) * W + x];
          const down = state.elevation[Math.min(H - 1, y + 1) * W + x];

          const dzdx = (right - left) / 2.0;
          const dzdy = (down - up) / 2.0;

          const nx = -dzdx;
          const ny = -dzdy;
          const nz = 38.0;
          const nLen = Math.hypot(nx, ny, nz);

          const dot = (nx * lx + ny * ly + nz * lz) / nLen;
          const shade = Math.max(0.25, Math.min(1.4, dot));

          const t = state.terrain[idx];

          let r = 24, g = 38, b = 28; // Agrarian pasture

          if (t === TERRAIN.FOREST) {
            r = 14; g = 30; b = 18;
          } else if (t === TERRAIN.RIVER) {
            r = 14; g = 55; b = 92;
          } else if (t === TERRAIN.ROAD) {
            r = 75; g = 70; b = 64;
          } else if (t === TERRAIN.BRIDGE) {
            r = 145; g = 95; b = 45;
          }

          if (t !== TERRAIN.RIVER && t !== TERRAIN.BRIDGE) {
            r = Math.min(255, Math.floor(r * shade));
            g = Math.min(255, Math.floor(g * shade));
            b = Math.min(255, Math.floor(b * shade));
          }

          // Cartographic survey lines (every 25 cells)
          if (x % 25 === 0 || y % 25 === 0) {
            r = Math.min(255, r + 15);
            g = Math.min(255, g + 15);
            b = Math.min(255, b + 20);
          }

          data[px] = r;
          data[px + 1] = g;
          data[px + 2] = b;
          data[px + 3] = 255;
        }
      }

      staticCtx.putImageData(imgData, 0, 0);
    }

    // --- 6. DYNAMIC TERRITORIAL PAINT BUFFER (LAYER 2) ---
    function renderDynamicTerritoryBuffer() {
      const data = territoryImageData.data;

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const ownerId = state.owner[i];
        const isBorder = state.frontline[i];
        const sup = state.supply[i];
        const px = i * 4;

        if (ownerId > 0 && state.factions.has(ownerId)) {
          const f = state.factions.get(ownerId);
          const [fr, fg, fb] = f.rgb;

          if (isBorder === 1) {
            // High-contrast frontline pixel
            data[px] = Math.min(255, fr + 95);
            data[px + 1] = Math.min(255, fg + 95);
            data[px + 2] = Math.min(255, fb + 95);
            data[px + 3] = 240;
          } else {
            // Pocketed / Out of supply pixels darken
            const supplyMult = sup > 10 ? 1.0 : 0.45;
            data[px] = Math.floor(fr * supplyMult);
            data[px + 1] = Math.floor(fg * supplyMult);
            data[px + 2] = Math.floor(fb * supplyMult);
            data[px + 3] = 160; // 60% opacity territorial tint
          }
        } else {
          // Unclaimed territory
          data[px + 3] = 0;
        }
      }

      dynamicCtx.putImageData(territoryImageData, 0, 0);
    }

    // --- 7. CORE CELLULAR SIMULATION TICK ---
    function stepSimulation() {
      state.ticks++;

      // 1. County Seats Mobilization
      state.factions.forEach(f => {
        if (!f.alive) return;
        f.troops += Math.max(1, Math.floor(f.territory * 0.08 + 2));

        // Attrition if pocketed / supply collapsed
        if (f.supplyIndex < 35) {
          f.troops = Math.max(10, f.troops - 2);
        }
      });

      // 2. Frontline Cellular Expansion with Highway Spearheads
      resolveFrontlineExpansion();

      // 3. Cellular Supply Diffusion & Pocket Starvation
      updateFrontlinesAndPocketing();

      // 4. Update dynamic canvas buffer
      if (state.ticks % 2 === 0) {
        renderDynamicTerritoryBuffer();
        updateAllMinimaps();
      }
      if (state.ticks % 6 === 0) {
        updateRoster();
      }
    }

    function resolveFrontlineExpansion() {
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      const samples = 3500; // stochastic combat iterations per tick

      for (let s = 0; s < samples; s++) {
        const x = rng.rangeInt(0, W - 1);
        const y = rng.rangeInt(0, H - 1);
        const idx = y * W + x;

        if (state.frontline[idx] !== 1) continue;

        const atkId = state.owner[idx];
        if (atkId === 0) continue;
        const attacker = state.factions.get(atkId);
        if (!attacker || !attacker.alive || attacker.troops < 5) continue;

        const d = dirs[rng.rangeInt(0, 3)];
        const nx = x + d[0];
        const ny = y + d[1];
        if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;

        const targetIdx = ny * W + nx;
        const targetTerrain = state.terrain[targetIdx];

        // Rivers are impassable barriers without bridges
        if (targetTerrain === TERRAIN.RIVER) continue;

        const targetOwnerId = state.owner[targetIdx];

        // Mechanics: Highways as 3x speed lanes
        const isHighway = (targetTerrain === TERRAIN.ROAD || targetTerrain === TERRAIN.BRIDGE);
        const highwayBonus = isHighway ? 3.0 : 1.0;

        // Topographic slope penalty
        const elevDelta = state.elevation[targetIdx] - state.elevation[idx];
        const slopePenalty = elevDelta > 0 ? (elevDelta / 255.0) * 1.9 : 0;
        const forestCover = targetTerrain === TERRAIN.FOREST ? 0.35 : 0;
        const supplyRatio = (state.supply[idx] / 100.0);

        // CASE 1: Peaceful Expansion into Unclaimed Pasture
        if (targetOwnerId === 0) {
          const moveProb = 0.25 * highwayBonus;
          if (rng.next() < moveProb && attacker.troops > 2) {
            attacker.troops -= 1;
            state.owner[targetIdx] = atkId;
            attacker.territory++;
          }
        }
        // CASE 2: Frontline Combat with Rival Faction
        else if (targetOwnerId !== atkId) {
          const defender = state.factions.get(targetOwnerId);
          if (!defender || !defender.alive) continue;

          const defSupplyRatio = (state.supply[targetIdx] / 100.0);

          const forceAtk = (attacker.baseAtk * highwayBonus * supplyRatio * (attacker.troops / Math.max(10, attacker.territory))) * (0.8 + rng.next() * 0.4);
          const forceDef = (defender.baseDef * (1 + slopePenalty + forestCover) * defSupplyRatio * (defender.troops / Math.max(10, defender.territory))) * (0.8 + rng.next() * 0.4);

          // Spawn combat sparks on active clashes
          if (rng.next() < 0.20) {
            spawnSparks(nx, ny, attacker.rgb);
          }

          if (forceAtk > forceDef) {
            // Frontline advances!
            defender.territory = Math.max(0, defender.territory - 1);
            defender.troops = Math.max(0, defender.troops - 2);
            attacker.troops = Math.max(0, attacker.troops - 1);

            state.owner[targetIdx] = atkId;
            attacker.territory++;

            // County Seat captured!
            if (nx === defender.capitalX && ny === defender.capitalY) {
              annexCountySeat(defender.id, attacker.id);
            }
          } else {
            attacker.troops = Math.max(0, attacker.troops - 2);
          }
        }
      }
    }

    function annexCountySeat(loserId, victorId) {
      const loser = state.factions.get(loserId);
      const victor = state.factions.get(victorId);
      if (!loser || !victor) return;

      loser.alive = false;
      showFlashNotice(`COUNTY SEAT FALLEN: ${loser.name.toUpperCase()} ANNEXED!`);

      for (let i = 0; i < TOTAL_CELLS; i++) {
        if (state.owner[i] === loserId) {
          state.owner[i] = victorId;
          victor.territory++;
        }
      }
      loser.territory = 0;

      if (loserId === state.playerFactionId) {
        showFlashNotice("YOUR COUNTY WAS CAPITULATED! Switched to Spectator.");
        state.playerFactionId = null;
      }
    }

    // Supply diffusion & pocket starvation
    function updateFrontlinesAndPocketing() {
      const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      state.frontline.fill(0);
      state.supply.fill(0);

      // Detect frontlines
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const o = state.owner[idx];
          if (o === 0) continue;

          for (const [dx, dy] of dirs) {
            const nx = x + dx;
            const ny = y + dy;
            if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
              if (state.owner[ny * W + nx] !== o) {
                state.frontline[idx] = 1;
                break;
              }
            }
          }
        }
      }

      // Breadth-first Supply diffusion from each county seat
      state.factions.forEach(f => {
        if (!f.alive) return;
        const capIdx = f.capitalY * W + f.capitalX;
        state.supply[capIdx] = 100;

        const queue = [{ x: f.capitalX, y: f.capitalY, sup: 100 }];
        const visited = new Uint8Array(TOTAL_CELLS);
        visited[capIdx] = 1;

        let head = 0;
        let totalFrontlines = 0;

        while (head < queue.length && head < 9000) {
          const curr = queue[head++];
          const cIdx = curr.y * W + curr.x;

          if (state.frontline[cIdx] === 1) totalFrontlines++;
          if (curr.sup <= 5) continue;

          for (const [dx, dy] of dirs) {
            const nx = curr.x + dx;
            const ny = curr.y + dy;
            if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
              const nidx = ny * W + nx;
              if (visited[nidx] === 0 && state.owner[nidx] === f.id) {
                visited[nidx] = 1;
                const isHwy = (state.terrain[nidx] === TERRAIN.ROAD || state.terrain[nidx] === TERRAIN.BRIDGE);
                const decay = isHwy ? 1 : 4; // Highways transmit supply 4x farther!
                const newSup = Math.max(0, curr.sup - decay);
                state.supply[nidx] = newSup;
                queue.push({ x: nx, y: ny, sup: newSup });
              }
            }
          }
        }

        f.frontlineCells = totalFrontlines;
        f.supplyIndex = queue.length > 0 ? Math.floor(queue.reduce((a, b) => a + b.sup, 0) / queue.length) : 50;

        // Pocket surrender check: Isolated pockets with zero supply surrender after cutoff
        if (state.ticks % 10 === 0) {
          for (let i = 0; i < TOTAL_CELLS; i++) {
            if (state.owner[i] === f.id && visited[i] === 0) {
              // Pocketed cell!
              if (rng.next() < 0.15) {
                state.owner[i] = 0; // Surrender to wilderness or adjacent besieger
                f.territory = Math.max(0, f.territory - 1);
              }
            }
          }
        }
      });
    }

    // --- 8. COMBAT SPARKS (LAYER 3) ---
    function spawnSparks(x, y, rgb) {
      for (let i = 0; i < 2; i++) {
        state.sparks.push({
          x: x + 0.5,
          y: y + 0.5,
          vx: (rng.next() - 0.5) * 1.6,
          vy: (rng.next() - 0.5) * 1.6,
          life: 0,
          maxLife: 14 + rng.rangeInt(0, 12),
          color: rng.next() > 0.4 ? '#fde047' : `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`
        });
      }
      if (state.sparks.length > 300) state.sparks.splice(0, 80);
    }

    // --- 9. RENDER LOOP (60 FPS) ---
    function renderScene() {
      mainCtx.fillStyle = '#060911';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

      mainCtx.save();
      mainCtx.translate(mainCanvas.width / 2, mainCanvas.height / 2);
      mainCtx.scale(state.zoom, state.zoom);
      mainCtx.translate(-mainCanvas.width / 2 + state.camX, -mainCanvas.height / 2 + state.camY);

      mainCtx.imageSmoothingEnabled = false;

      // 1. Static Topographic Hillshade (Layer 1)
      mainCtx.drawImage(staticCanvas, 0, 0, mainCanvas.width, mainCanvas.height);

      // 2. Dynamic Territorial Paint (Layer 2 @ 60% opacity)
      mainCtx.globalAlpha = 0.65;
      mainCtx.drawImage(dynamicCanvas, 0, 0, mainCanvas.width, mainCanvas.height);
      mainCtx.globalAlpha = 1.0;

      // 3. Top Vector Overlays (Layer 3)
      drawVectorOverlays(mainCtx);

      mainCtx.restore();
    }

    function drawVectorOverlays(ctx) {
      const tileW = mainCanvas.width / W;
      const tileH = mainCanvas.height / H;

      // Draw Sparks
      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const p = state.sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life++;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, 1 - (p.life / p.maxLife));
        ctx.fillRect(p.x * tileW, p.y * tileH, 2.5 / state.zoom, 2.5 / state.zoom);

        if (p.life >= p.maxLife) state.sparks.splice(i, 1);
      }
      ctx.globalAlpha = 1.0;

      // County Seat Pins
      state.factions.forEach(f => {
        if (!f.alive) return;
        const cx = f.capitalX * tileW + tileW / 2;
        const cy = f.capitalY * tileH + tileH / 2;

        // Glowing halo
        const haloR = Math.max(7, 12 / state.zoom);
        ctx.beginPath();
        ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
        ctx.strokeStyle = f.hex;
        ctx.lineWidth = 1.5 / state.zoom;
        ctx.stroke();

        // Pin Star
        ctx.font = `${Math.max(11, 13 / state.zoom)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('⭐', cx, cy - (7 / state.zoom));

        // Town label
        ctx.font = `bold ${Math.max(9, 10 / state.zoom)}px ui-monospace, monospace`;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillStyle = f.id === state.playerFactionId ? '#fbbf24' : '#f8fafc';
        ctx.fillText(f.town, cx, cy + (9 / state.zoom));
        ctx.shadowBlur = 0;
      });

      // Selection Marker
      if (state.selectedFactionId && state.factions.has(state.selectedFactionId)) {
        const sel = state.factions.get(state.selectedFactionId);
        const scx = sel.capitalX * tileW + tileW / 2;
        const scy = sel.capitalY * tileH + tileH / 2;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 / state.zoom;
        ctx.strokeRect(scx - 11 / state.zoom, scy - 11 / state.zoom, 22 / state.zoom, 22 / state.zoom);
      }
    }

    // --- 10. MINIMAP SYNCHRONIZATION ---
    function updateAllMinimaps() {
      minimapCtx.drawImage(staticCanvas, 0, 0);
      minimapCtx.globalAlpha = 0.65;
      minimapCtx.drawImage(dynamicCanvas, 0, 0);
      minimapCtx.globalAlpha = 1.0;

      // Copy to visible sheet or desktop minimaps if active
      const sheetCanvas = document.getElementById('sheetMinimapCanvas');
      if (sheetCanvas) {
        const sCtx = sheetCanvas.getContext('2d');
        sCtx.drawImage(minimapCanvas, 0, 0, sheetCanvas.width, sheetCanvas.height);
      }

      const deskCanvas = document.getElementById('desktopMinimapCanvas');
      if (deskCanvas) {
        const dCtx = deskCanvas.getContext('2d');
        dCtx.drawImage(minimapCanvas, 0, 0, deskCanvas.width, deskCanvas.height);
      }
    }

    // --- 11. HUD, ROSTER & SHEET DRAWER LOGIC ---
    function updateRoster() {
      const living = Array.from(state.factions.values()).filter(f => f.alive);
      living.sort((a, b) => b.territory - a.territory);

      const html = living.map((f, idx) => {
        const pct = ((f.territory / TOTAL_CELLS) * 100).toFixed(1);
        const isSel = f.id === state.selectedFactionId;
        const isPlayer = f.id === state.playerFactionId;
        return `
          <div data-id="${f.id}" class="sheet-roster-card ${isSel ? 'active' : ''}">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="color: #64748b; width: 14px;">${idx + 1}</span>
              <div style="width: 10px; height: 10px; border-radius: 50%; background: ${f.hex};"></div>
              <span style="font-weight: 700; color: #fff;">${f.town}</span>
              ${isPlayer ? '<span style="color: var(--amber); font-size: 9px; font-weight: 800;">[PLAYER]</span>' : ''}
            </div>
            <div style="display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 10px;">
              <span style="color: var(--cyan); font-weight: 800;">${pct}%</span>
              <span>🪖${f.troops}</span>
            </div>
          </div>
        `;
      }).join('');

      // Inject to desktop and sheet
      const deskList = document.getElementById('desktopRosterList');
      if (deskList) {
        deskList.innerHTML = html;
        bindRosterClicks(deskList);
      }

      const sheetRoster = document.getElementById('sheetRosterList');
      if (sheetRoster) {
        sheetRoster.innerHTML = html;
        bindRosterClicks(sheetRoster);
      }

      const countEl = document.getElementById('deskCombatantCount');
      if (countEl) countEl.innerText = `${living.length} Factions`;
    }

    function bindRosterClicks(parent) {
      parent.querySelectorAll('.sheet-roster-card').forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.id);
          selectFaction(id);
        });
      });
    }

    function selectFaction(id) {
      state.selectedFactionId = id;
      const card = document.getElementById('selectionCard');

      if (id && state.factions.has(id)) {
        const f = state.factions.get(id);
        document.getElementById('selDot').style.background = f.hex;
        document.getElementById('selName').innerText = f.name;
        const pct = ((f.territory / TOTAL_CELLS) * 100).toFixed(1);
        document.getElementById('selStats').innerText = `Territory: ${pct}% • Troops: ${f.troops} • Supply: ${f.supplyIndex}%`;

        const cmdBtn = document.getElementById('btnCommandSelected');
        cmdBtn.innerText = f.id === state.playerFactionId ? "Relinquish (God)" : "Take Command";

        card.classList.add('show');
        panTo(f.capitalX, f.capitalY);
      } else {
        card.classList.remove('show');
      }
      updateRoster();
    }

    document.getElementById('btnCommandSelected').addEventListener('click', () => {
      if (!state.selectedFactionId) return;
      if (state.playerFactionId === state.selectedFactionId) {
        state.playerFactionId = null;
        showFlashNotice("SPECTATOR (GOD) MODE ENGAGED");
      } else {
        state.playerFactionId = state.selectedFactionId;
        const f = state.factions.get(state.playerFactionId);
        showFlashNotice(`ASSUMED SOVEREIGN COMMAND: ${f.name.toUpperCase()}`);
      }
      selectFaction(state.selectedFactionId);
    });

    function panTo(x, y) {
      const tileW = mainCanvas.width / W;
      const tileH = mainCanvas.height / H;
      state.camX = (mainCanvas.width / 2) - (x * tileW);
      state.camY = (mainCanvas.height / 2) - (y * tileH);
    }

    function showFlashNotice(msg) {
      const el = document.getElementById('hudNotice');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    // --- 12. BOTTOM SHEET DRAWER MANAGER ---
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const bottomSheet = document.getElementById('bottomSheet');
    const sheetTitle = document.getElementById('sheetTitle');
    const sheetContent = document.getElementById('sheetContent');

    function openSheet(type) {
      document.querySelectorAll('.dock-pill').forEach(p => p.classList.remove('active'));
      const activePill = document.querySelector(`.dock-pill[data-sheet="${type}"]`);
      if (activePill) activePill.classList.add('active');

      if (type === 'roster') {
        sheetTitle.innerText = "Regional Factions Roster";
        sheetContent.innerHTML = `<div class="sheet-roster-list" id="sheetRosterList"></div>`;
        updateRoster();
      } else if (type === 'radar') {
        sheetTitle.innerText = "Topographic Radar (300x300)";
        sheetContent.innerHTML = `
          <div class="sheet-radar-container">
            <canvas id="sheetMinimapCanvas" width="300" height="300"></canvas>
          </div>
          <div style="text-align: center; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); margin-top: 8px;">
            Tap anywhere on radar to pan tactical camera
          </div>
        `;
        updateAllMinimaps();
        bindMinimapInteraction(document.getElementById('sheetMinimapCanvas'));
      } else if (type === 'powers') {
        sheetTitle.innerText = "God Interventions";
        sheetContent.innerHTML = `
          <div class="sheet-tools-grid">
            <button class="tactical-tool-btn" data-tool="bombard">
              <span>💥 Artillery Strike</span>
              <span class="tool-sub">Decimate sector</span>
            </button>
            <button class="tactical-tool-btn" data-tool="bridge">
              <span>🪵 Engineer Bridge</span>
              <span class="tool-sub">Span river tile</span>
            </button>
            <button class="tactical-tool-btn" data-tool="supply">
              <span>📦 Airdrop Supply</span>
              <span class="tool-sub">+100 Sector supply</span>
            </button>
            <button class="tactical-tool-btn" data-tool="fortify">
              <span>🛡️ Dig Trenchline</span>
              <span class="tool-sub">+Elevation ridge</span>
            </button>
          </div>
        `;
        bindToolButtons(sheetContent);
      } else if (type === 'settings') {
        sheetTitle.innerText = "Theater Controls";
        sheetContent.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 10px; font-family: var(--font-mono); font-size: 11px;">
            <button id="btnResetConflict" style="padding: 10px; background: var(--cyan); color: #030712; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">
              Generate New Conflict Theater
            </button>
            <button id="btnResetView" style="padding: 10px; background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer;">
              Reset Camera View (100%)
            </button>
          </div>
        `;
        document.getElementById('btnResetConflict').onclick = () => {
          closeSheet();
          initTheater();
        };
        document.getElementById('btnResetView').onclick = () => {
          state.camX = 0; state.camY = 0; state.zoom = 1.0;
          closeSheet();
        };
      }

      sheetBackdrop.classList.add('open');
      bottomSheet.classList.add('open');
    }

    function closeSheet() {
      sheetBackdrop.classList.remove('open');
      bottomSheet.classList.remove('open');
      document.querySelectorAll('.dock-pill').forEach(p => p.classList.remove('active'));
    }

    document.querySelectorAll('.dock-pill').forEach(pill => {
      pill.addEventListener('click', () => openSheet(pill.dataset.sheet));
    });

    sheetBackdrop.addEventListener('click', closeSheet);
    document.getElementById('btnCloseSheet').addEventListener('click', closeSheet);
    document.getElementById('sheetHandle').addEventListener('click', closeSheet);

    function bindToolButtons(parent) {
      parent.querySelectorAll('.tactical-tool-btn').forEach(b => {
        b.addEventListener('click', () => {
          const tool = b.dataset.tool;
          state.activeTool = tool;
          closeSheet();
          showFlashNotice(`ARMED: ${tool.toUpperCase()} - TAP MAP TO DEPLOY`);
        });
      });
    }
    bindToolButtons(document);

    function bindMinimapInteraction(canvasEl) {
      canvasEl.addEventListener('click', e => {
        const r = canvasEl.getBoundingClientRect();
        const mx = (e.clientX - r.left) / r.width;
        const my = (e.clientY - r.top) / r.height;
        panTo(Math.floor(mx * W), Math.floor(my * H));
        closeSheet();
      });
    }

    const deskMinimap = document.getElementById('desktopMinimapCanvas');
    if (deskMinimap) bindMinimapInteraction(deskMinimap);

    // --- 13. CINEMA MODE ---
    function toggleCinemaMode(force) {
      const isCinema = force !== undefined ? force : !document.body.classList.contains('cinema-mode');
      document.body.classList.toggle('cinema-mode', isCinema);
      closeSheet();
    }

    document.getElementById('btnCinemaToggle').addEventListener('click', () => toggleCinemaMode(true));
    document.getElementById('btnExitCinema').addEventListener('click', () => toggleCinemaMode(false));

    window.addEventListener('keydown', e => {
      if (e.key === 'c' || e.key === 'C') {
        toggleCinemaMode();
      } else if (e.key === ' ') {
        e.preventDefault();
        state.isPaused = !state.isPaused;
        document.getElementById('btnPause').innerText = state.isPaused ? '▶' : '❚❚';
      }
    });

    // Speed buttons
    document.getElementById('btnPause').addEventListener('click', () => {
      state.isPaused = !state.isPaused;
      document.getElementById('btnPause').innerText = state.isPaused ? '▶' : '❚❚';
    });

    const spdMap = [
      { id: 'btnSpeed1', v: 1 },
      { id: 'btnSpeed2', v: 2 },
      { id: 'btnSpeed5', v: 5 }
    ];
    spdMap.forEach(s => {
      document.getElementById(s.id).addEventListener('click', () => {
        state.speed = s.v;
        state.isPaused = false;
        document.getElementById('btnPause').innerText = '❚❚';
        spdMap.forEach(o => document.getElementById(o.id).classList.toggle('active', o.v === s.v));
      });
    });

    // --- 14. TOUCH & POINTER EVENTS (PINCH-TO-ZOOM + PAN) ---
    function getTileFromEvent(clientX, clientY) {
      const rect = mainCanvas.getBoundingClientRect();
      const mouseX = clientX - rect.left;
      const mouseY = clientY - rect.top;

      const screenCenterX = mainCanvas.width / 2;
      const screenCenterY = mainCanvas.height / 2;

      const worldX = (mouseX - screenCenterX) / state.zoom + screenCenterX - state.camX;
      const worldY = (mouseY - screenCenterY) / state.zoom + screenCenterY - state.camY;

      const tx = Math.floor((worldX / mainCanvas.width) * W);
      const ty = Math.floor((worldY / mainCanvas.height) * H);

      if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
        return { x: tx, y: ty, idx: ty * W + tx };
      }
      return null;
    }

    // Mouse Listeners
    mainCanvas.addEventListener('mousedown', e => {
      if (e.button === 0) {
        state.isDragging = true;
        state.dragStartX = e.clientX - state.camX;
        state.dragStartY = e.clientY - state.camY;
      }
    });

    window.addEventListener('mousemove', e => {
      if (state.isDragging) {
        state.camX = e.clientX - state.dragStartX;
        state.camY = e.clientY - state.dragStartY;
      }
    });

    window.addEventListener('mouseup', e => {
      if (state.isDragging) {
        state.isDragging = false;
        const d = Math.hypot(e.clientX - (state.dragStartX + state.camX), e.clientY - (state.dragStartY + state.camY));
        if (d < 5) handleTap(e.clientX, e.clientY);
      }
    });

    mainCanvas.addEventListener('wheel', e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.15 : 0.85;
      state.zoom = Math.min(6.0, Math.max(0.65, state.zoom * f));
    }, { passive: false });

    // Touch Listeners for iPhone / Mobile
    mainCanvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        state.isDragging = true;
        state.dragStartX = e.touches[0].clientX - state.camX;
        state.dragStartY = e.touches[0].clientY - state.camY;
      } else if (e.touches.length === 2) {
        state.isDragging = false;
        state.touchStartDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.initialTouchZoom = state.zoom;
      }
    }, { passive: true });

    mainCanvas.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && state.isDragging) {
        state.camX = e.touches[0].clientX - state.dragStartX;
        state.camY = e.touches[0].clientY - state.dragStartY;
      } else if (e.touches.length === 2 && state.touchStartDist > 0) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = currentDist / state.touchStartDist;
        state.zoom = Math.min(6.0, Math.max(0.65, state.initialTouchZoom * scale));
      }
    }, { passive: true });

    mainCanvas.addEventListener('touchend', e => {
      if (state.isDragging && e.changedTouches.length === 1) {
        state.isDragging = false;
        const t = e.changedTouches[0];
        const d = Math.hypot(t.clientX - (state.dragStartX + state.camX), t.clientY - (state.dragStartY + state.camY));
        if (d < 8) handleTap(t.clientX, t.clientY);
      }
      if (e.touches.length < 2) {
        state.touchStartDist = 0;
      }
    }, { passive: true });

    function handleTap(clientX, clientY) {
      const tile = getTileFromEvent(clientX, clientY);
      if (!tile) return;

      // Handle god tool execution
      if (state.activeTool) {
        applyGodTool(tile.x, tile.y);
        state.activeTool = null;
        return;
      }

      // Default: inspect sector/county
      const ownerId = state.owner[tile.idx];
      selectFaction(ownerId);
    }

    function applyGodTool(tx, ty) {
      const idx = ty * W + tx;

      if (state.activeTool === 'bombard') {
        const r = 4;
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const x = tx + dx;
            const y = ty + dy;
            if (x >= 0 && x < W && y >= 0 && y < H) {
              const i = y * W + x;
              const o = state.owner[i];
              if (o > 0 && state.factions.has(o)) state.factions.get(o).territory--;
              state.owner[i] = 0;
              spawnSparks(x, y, [255, 120, 60]);
            }
          }
        }
        showFlashNotice("SECTOR BOMBARDED");
        bakeStaticHillshade();
      } else if (state.activeTool === 'bridge') {
        if (state.terrain[idx] === TERRAIN.RIVER) {
          state.terrain[idx] = TERRAIN.BRIDGE;
          showFlashNotice("PONTOON BRIDGE CONSTRUCTED");
          bakeStaticHillshade();
        } else {
          showFlashNotice("MUST TARGET RIVER TILE");
        }
      } else if (state.activeTool === 'supply') {
        state.supply[idx] = 100;
        showFlashNotice("EMERGENCY AIRDROP SECURED");
      } else if (state.activeTool === 'fortify') {
        state.elevation[idx] = Math.min(255, state.elevation[idx] + 65);
        showFlashNotice("RIDGE FORTIFICATION RAISED");
        bakeStaticHillshade();
      }

      renderDynamicTerritoryBuffer();
      updateAllMinimaps();
    }

    function resizeCanvas() {
      mainCanvas.width = mainCanvas.clientWidth;
      mainCanvas.height = mainCanvas.clientHeight;
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      renderScene();
    });

    // --- 15. DUAL-LOOP TICKER ---
    let lastTick = performance.now();

    function loop(now) {
      if (!state.isPaused && state.speed > 0) {
        const interval = 250 / state.speed;
        if (now - lastTick >= interval) {
          stepSimulation();
          lastTick = now;
        }
      }

      renderScene();
      requestAnimationFrame(loop);
    }

    // Launch
    window.onload = function() {
      resizeCanvas();
      initTheater();
      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>
