      --bg: #fdfaf5;
      --card-bg: #ffffff;
      --surface: #f7f3ea;
      --border: #111111;
      --border-subtle: rgba(17, 17, 17, 0.2);
      --text: #111111;
      --text-muted: #374151;
      --text-dim: #6b7280;
      --heading: #1b4332;
      --ok: #1b4332;
      --ok-text: #1b4332;
      --ok-bg: rgba(27, 67, 50, 0.08);
      --warn: #b45309;
      --warn-text: #b45309;
      --warn-bg: rgba(180, 83, 9, 0.08);
      --danger: #991b1b;
      --danger-text: #991b1b;
      --danger-bg: rgba(153, 27, 27, 0.08);
      --accent: #1b4332;
      --shadow-hard: 3px 3px 0px #111111;
      --shadow-hover: 5px 5px 0px #111111;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    [data-theme="hearth"] {
      --bg: #171412;
      --card-bg: #221d1a;
      --surface: #1a1613;
      --border: rgba(214, 180, 140, 0.35);
      --border-subtle: rgba(214, 180, 140, 0.15);
      --text: #f5f0e8;
      --text-muted: #c7beaf;
      --text-dim: #8f8576;
      --heading: #4ade80;
      --ok: #4ade80;
      --ok-text: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.1);
      --warn: #f59e0b;
      --warn-text: #f59e0b;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --danger: #f87171;
      --danger-text: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.1);
      --accent: #d97706;
      --shadow-hard: 3px 3px 0px #0c0a09;
      --shadow-hover: 5px 5px 0px #0c0a09;
    }

    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 80px;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .utility-bar {
      border-bottom: 1px solid var(--border-subtle);
      background: var(--surface);
      padding: 6px 24px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
    
    header.masthead {
      border-bottom: 3px double var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 16px;
    }
    .masthead-title {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 700;
      line-height: 1.1;
      margin: 0;
      color: var(--text);
    }
    .masthead-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--warn);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* SECURITY BAR & VAULT LOCK */
    .security-bar {
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-hard);
      padding: 12px 18px;
      border-radius: 4px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 13px;
    }
    .security-bar input {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    /* CONTROLS (3-AXIS MATRIX) */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr;
      gap: 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-hard);
      padding: 16px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr; }
    }

    input, select, button {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
    }
    input:focus, select:focus {
      outline: 2px solid var(--accent);
    }

    button.btn-primary {
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      border: 1.5px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    button.btn-primary:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      color: var(--text);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* ASSET CARDS GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(620px, 1fr));
      gap: 24px;
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
    }

    .asset-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      box-shadow: var(--shadow-hard);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1.5px solid var(--border-subtle);
      padding-bottom: 12px;
      gap: 12px;
    }
    .asset-name {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      border-radius: 2px;
      border: 1px solid currentColor;
      text-transform: uppercase;
    }
    .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
    .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
    .badge-danger { background: var(--danger-bg); color: var(--danger-text); }

    table.rules-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }
    table.rules-table th, table.rules-table td {
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 10px;
      text-align: left;
    }
    table.rules-table th {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-dim);
      background: var(--surface);
    }

    .spec-grid {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      padding: 12px 14px;
      font-size: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 8px 16px;
    }
    .spec-item strong {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-dim);
      display: block;
    }

    .trouble-box {
      background: var(--danger-bg);
      border-left: 3px solid var(--danger);
      padding: 10px 14px;
      font-size: 12px;
    }
    .trouble-box strong {
      color: var(--danger-text);
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .trouble-box ul { margin: 0; padding-left: 18px; }
    .trouble-box li { margin-bottom: 4px; }

    .parts-box {
      background: var(--ok-bg);
      border-left: 3px solid var(--ok);
      padding: 10px 14px;
      font-size: 12px;
    }
    .parts-box strong {
      color: var(--ok-text);
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;

      box-shadow: 1px 1px 0px var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.1s ease;
    }
    .btn-action-task:hover {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0px var(--border);
    }
  </style>
</head>

function initTheme() {
  const t = localStorage.getItem("bb_os_theme") || "broadsheet";
  setTheme(t);
}
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("bb_os_theme", t);
  const btn = document.getElementById("theme-toggle");
  btn.textContent = t === "hearth" ? "☕ Hearth Dark" : "📰 Broadsheet Mode";
}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || "broadsheet";
  setTheme(cur === "broadsheet" ? "hearth" : "broadsheet");
});
initTheme();

// -------------------------------------------------------------------------
// DETERMINISTIC EVALUATION ENGINE
// -------------------------------------------------------------------------
function evaluateRule(rule, currentMetric, lastServiced) {
  const diff = currentMetric - (lastServiced || 0);
  const remaining = rule.interval - diff;

  if (remaining <= 0) {
    return { status: "OVERDUE", code: "danger", delta: Math.abs(remaining), diff: diff };
  } else if (remaining <= rule.buffer) {
    return { status: "DUE SOON", code: "warn", delta: remaining, diff: diff };
  }
  return { status: "NOMINAL", code: "ok", delta: remaining, diff: diff };
}

function updateMetric(assetId, newValue) {
  STATE.assets[assetId].current_metric = parseFloat(newValue) || 0;
  saveLocal();
  render();
}

function logService(assetId, ruleId) {
  const cur = STATE.assets[assetId].current_metric;
  STATE.assets[assetId].service_history[ruleId] = cur;
  saveLocal();
  render();
}

function copyTaskToLedger(assetName, zone, operator, ruleItem, spec) {
  const line = `* [ ] Service: ${ruleItem} (${assetName}) | Zone: ${zone} | Assigned: ${operator} | Spec: ${spec} | Logged: ${new Date().toLocaleDateString()}`;
  navigator.clipboard.writeText(line).then(() => {
    alert("📋 Copied Atomic Task for Bold Bovine Ledger:\n\n" + line);
  });
}

function saveLocal() {
  localStorage.setItem("household_fleet_state_v2", JSON.stringify(STATE));
}

function loadLocal() {
  const raw = localStorage.getItem("household_fleet_state_v2");
  if (raw) {
    try { STATE = JSON.parse(raw); } catch(e) {}
  }
}

// -------------------------------------------------------------------------
// LOCAL ENCRYPTION AT REST (WebCrypto AES-GCM)
// -------------------------------------------------------------------------
async function getKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await window.crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return window.crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function saveEncryptedVault() {
  const pwd = document.getElementById("vault-passphrase").value;
  if (!pwd) return alert("Enter a passphrase to lock the vault.");
  
  const salt = window.crypto.getRandomValues(new Uint8Array(16));
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const key = await getKey(pwd, salt);
  const enc = new TextEncoder();
  const ciphertext = await window.crypto.subtle.encrypt(
    { name: "AES-GCM", iv: iv },
    key,
    enc.encode(JSON.stringify(STATE))
  );

  const payload = {
    salt: Array.from(salt),
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(ciphertext))
  };

  localStorage.setItem("household_fleet_state_encrypted_v2", JSON.stringify(payload));
  document.getElementById("vault-status").innerHTML = "<strong style='color:var(--ok-text);'>Encrypted In LocalStorage</strong>";
  alert("Fleet state successfully encrypted with AES-GCM.");
}

async function loadEncryptedVault() {
  const pwd = document.getElementById("vault-passphrase").value;
  if (!pwd) return alert("Enter passphrase to decrypt.");
  const raw = localStorage.getItem("household_fleet_state_encrypted_v2");
  if (!raw) return alert("No encrypted payload found in localStorage.");

  try {
    const payload = JSON.parse(raw);
    const salt = new Uint8Array(payload.salt);
    const iv = new Uint8Array(payload.iv);
    const data = new Uint8Array(payload.data);
    const key = await getKey(pwd, salt);

    const decrypted = await window.crypto.subtle.decrypt(
      { name: "AES-GCM", iv: iv },
      key,
      data
    );

    STATE = JSON.parse(new TextDecoder().decode(decrypted));
    document.getElementById("vault-status").innerHTML = "<strong style='color:var(--heading);'>Decrypted Vault Active</strong>";
    render();
    alert("Vault decrypted successfully.");
  } catch(e) {
    alert("Decryption failed. Invalid passphrase.");
  }
}

// RENDER INTERFACE (3-Axis Compound Filtering)
// -------------------------------------------------------------------------
function render() {
  const qWhat = document.getElementById("query-what").value.toLowerCase().trim();
  const qWhere = document.getElementById("query-where").value;
  const qStatus = document.getElementById("query-status").value;
  const container = document.getElementById("fleet-grid");
  container.innerHTML = "";

  Object.keys(BOK).forEach(id => {
    const bok = BOK[id];
    const asset = STATE.assets[id];

    // Spatial Filter
    if (qWhere !== "ALL" && asset.zone !== qWhere) return;

    // Evaluate Rules
    let rowsHtml = "";
    let hasAction = false;
    let cardMatchesWhat = bok.name.toLowerCase().includes(qWhat) || 
                          asset.zone.toLowerCase().includes(qWhat) ||
                          JSON.stringify(bok.specs).toLowerCase().includes(qWhat) ||
                          JSON.stringify(bok.troubleshooting_and_watchouts).toLowerCase().includes(qWhat);

    bok.rules.forEach(rule => {
      const last = asset.service_history[rule.id] || 0;
      const res = evaluateRule(rule, asset.current_metric, last);

      if (res.code !== "ok") hasAction = true;

      // Status Filter
      if (qStatus === "ACTION" && res.code === "ok") return;
      if (qStatus === "NOMINAL" && res.code !== "ok") return;

      // Keyword Filter against rule
      const ruleMatchesWhat = rule.item.toLowerCase().includes(qWhat) || 
                              rule.spec.toLowerCase().includes(qWhat);
      if (qWhat && !ruleMatchesWhat && !cardMatchesWhat) return;

      rowsHtml += `
        <tr>
          <td>
            <strong>${rule.item}</strong><br>
            <small style="color:var(--text-muted);">${rule.spec}</small>
          </td>
          <td style="font-family:var(--font-mono);">${rule.interval.toLocaleString()} ${asset.metric_type}</td>
          <td style="font-family:var(--font-mono);">${last.toLocaleString()}</td>
          <td><span class="badge badge-${res.code}">${res.status} (${res.delta.toLocaleString()} ${asset.metric_type})</span></td>
          <td style="white-space:nowrap;">
            <button class="btn-action-task" onclick="logService('${id}', '${rule.id}')">✓ Done</button>
            <button class="btn-action-task" onclick="copyTaskToLedger('${bok.name.replace(/'/g, "\\'")}', '${asset.zone}', '${asset.operator}', '${rule.item.replace(/'/g, "\\'")}', '${rule.spec.replace(/'/g, "\\'")}')">📋 Copy</button>
          </td>
        </tr>
      `;
    });

    if (!rowsHtml && qStatus !== "ALL") return;
    if (qWhat && !cardMatchesWhat && !rowsHtml) return;

    // Spec Box
    let specsHtml = Object.entries(bok.specs)
      .map(([k, v]) => `<div class="spec-item"><strong>${k.replace(/_/g, ' ')}</strong>${v}</div>`)
      .join("");

    // Troubleshooting / Watchouts
    let watchHtml = bok.troubleshooting_and_watchouts
      .map(w => `<li>${w}</li>`)
      .join("");

    // Parts Sourcing
    let partsHtml = Object.entries(bok.parts_sourcing || {})
      .map(([k, v]) => `<div><strong>${k.replace(/_/g, ' ').toUpperCase()}:</strong> ${v}</div>`)
      .join("");

    const card = document.createElement("div");
    card.className = "asset-card";
    card.innerHTML = `
      <div class="asset-header">
        <div>
          <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-dim); text-transform:uppercase;">
            ${asset.zone} · ${asset.sub_location} · Operator: ${asset.operator}
          </div>
          <h2 class="asset-name">${bok.name}</h2>
        </div>
        <div style="text-align:right;">
          <label style="font-family:var(--font-mono); font-size:10px; color:var(--text-dim); display:block; text-transform:uppercase;">CURRENT ${asset.metric_type.toUpperCase()}</label>
          <input type="number" value="${asset.current_metric}" id="metric-${id}" style="width:130px; font-family:var(--font-mono); font-weight:700; text-align:right;"
                 onchange="updateMetric('${id}', this.value)">
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table class="rules-table">
          <thead>
            <tr>
              <th>Procedure / Subsystem</th>
              <th>Interval</th>
              <th>Last Serviced</th>
              <th>Deterministic Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml || `<tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:16px;">All rules nominal or filter criteria not met</td></tr>`}
          </tbody>
        </table>
      </div>

      <div class="spec-grid">
        ${specsHtml}
      </div>

      <div class="trouble-box">
        <strong>⚠️ Field Watchouts, Recalls & Mechanical Failure Modes:</strong>
        <ul>${watchHtml}</ul>
      </div>

      <div class="parts-box">
        <strong>📦 OEM Parts Sourcing & Approved Equivalents:</strong>
        ${partsHtml}
      </div>
    `;
    container.appendChild(card);
  });
}

// Initialize
loadLocal();
render();
setInterval(() => {
  document.getElementById("clock").innerText = new Date().toLocaleDateString(undefined, {
    weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
  }) + " · Easton";
}, 1000);
</script>
</body>
</html>
