name: Pleasant Ridge Gazette - Refresh Poller Ping
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 30-Minute Streamflow & Weather Cache Refresh
        run: |
          curl -s -f "https://pleasant-ridge-gazette.vercel.app/api/refresh-status" || echo "Refresh status ping completed"
          curl -s -f "https://pleasant-ridge-gazette.vercel.app/api/incidents" || echo "Incidents/USGS ping completed"
          curl -s -f "https://pleasant-ridge-gazette.vercel.app/api/weather-forecast" || echo "Weather/NWS ping completed"
